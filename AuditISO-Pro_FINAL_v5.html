          </div>
          <p className="rep-p">Avance de la lista de verificación: <b>{metrics.done}/{metrics.total} ({metrics.pct}%)</b>. No conformidades abiertas: <b>{metrics.open}</b>{metrics.overdue > 0 && <> (<b>{metrics.overdue}</b> con plazo vencido)</>}.</p>
          <p className="rep-p">Riesgos críticos/altos sin controlar: <b>{criticalRisks.length}</b> · Documentos aprobados: <b>{approvedDocs}/{documents.length || 0}</b> · Auditores calificados: <b>{auditors.length}</b> · Personal con brecha de competencia: <b>{people.filter((p) => (p.evals || []).some((e) => e.result !== "Competente")).length}</b>.</p>
        </RepBlock>

        {plan.length > 0 && (
          <RepBlock n={N()} title="Programa / agenda de auditoría">
            {[...new Set(plan.map((r) => r.day))].map((d, di) => {
              const rows = plan.filter((r) => r.day === d).sort((a, b) => (a.start || "").localeCompare(b.start || ""));
              if (!rows.length) return null;
              return (
                <div key={di} className="rep-fg">
                  <h4>{d ? fmt(d) : `Día ${di + 1}`}</h4>
                  <table className="rep-tbl"><thead><tr><th>Horario</th><th>Actividad</th><th>Área/Proceso</th><th>Cláusulas</th><th>Auditor</th></tr></thead>
                    <tbody>{rows.map((r) => <tr key={r.id}><td>{r.start || ""}{r.end ? `–${r.end}` : ""}</td><td>{r.activity || "—"}</td><td>{r.area}</td><td>{r.clause}</td><td>{r.auditor}</td></tr>)}</tbody></table>
                </div>
              );
            })}
          </RepBlock>
        )}

        <RepBlock n={N()} title="Detalle de hallazgos">
          {findings.length === 0 ? <p className="rep-p faint">Sin hallazgos registrados.</p> : grouped.filter((g) => g.list.length).map((g) => {
            const t = FINDING_TYPES[g.k];
            return (
              <div key={g.k} className="rep-fg">
                <h4 style={{ color: t.c }}>{t.label} ({g.list.length})</h4>
                {g.list.map((f, i) => (
                  <div key={f.id} className="rep-f">
                    <div className="rep-f-h mono">{t.short} #{i + 1} · {STANDARDS[f.std]?.name} {f.clause || "—"}{f.area && ` · ${f.area}`}</div>
                    <p>{f.desc || "—"}</p>
                    {f.evidence && <p className="rep-sm"><b>Evidencia:</b> {f.evidence}</p>}
                    {f.risk && <p className="rep-sm"><b>Riesgo:</b> {f.risk}</p>}
                    {(f.type === "ncm" || f.type === "ncmenor") && (
                      <div className="rep-rc">
                        {f.rootCause?.method === "5why" && (f.rootCause.whys || []).some(Boolean) && <p><b>Causa raíz:</b> {(f.rootCause.whys || []).filter(Boolean).join(" → ")}</p>}
                        {f.rootCause?.method === "ishikawa" && Object.values(f.rootCause.ishikawa || {}).some(Boolean) && <p><b>Causa raíz (Ishikawa):</b> {Object.entries(f.rootCause.ishikawa).filter(([, v]) => v).map(([k, v]) => `${k}: ${v}`).join("; ")}</p>}
                        {f.action?.correctiveAction && <p><b>Acción correctiva:</b> {f.action.correctiveAction}{f.action.responsible && ` — ${f.action.responsible}`}{f.action.due && ` (${f.action.due})`} · {f.action.status}</p>}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            );
          })}
        </RepBlock>

        {criticalRisks.length > 0 && (
          <RepBlock n={N()} title="Riesgos significativos">
            <table className="rep-tbl"><thead><tr><th>Proceso</th><th>Riesgo</th><th>P×I</th><th>Nivel</th><th>Tratamiento</th><th>Estado</th></tr></thead>
              <tbody>{criticalRisks.map((r) => { const lv = riskLevel(r.prob * r.impact); return <tr key={r.id}><td>{r.process || "—"}</td><td>{r.desc || "—"}</td><td>{r.prob * r.impact}</td><td>{lv.label}</td><td>{r.treatment || "—"}</td><td>{r.status}</td></tr>; })}</tbody></table>
          </RepBlock>
        )}

        {documents.length > 0 && (
          <RepBlock n={N()} title="Control documental">
            <table className="rep-tbl"><thead><tr><th>Código</th><th>Documento</th><th>Tipo</th><th>Ver.</th><th>Estado</th><th>Próx. revisión</th></tr></thead>
              <tbody>{documents.map((d) => <tr key={d.id}><td>{d.code || "—"}</td><td>{d.title || "—"}</td><td>{d.type}</td><td>{d.version}</td><td>{(DOC_STATUS[d.status] || {}).label}</td><td>{d.nextReview || "—"}</td></tr>)}</tbody></table>
          </RepBlock>
        )}

        {people.length > 0 && (
          <RepBlock n={N()} title="Competencias y equipo auditor">
            <table className="rep-tbl"><thead><tr><th>Nombre</th><th>Cargo</th><th>Rol</th><th>Formaciones</th><th>Certificaciones</th></tr></thead>
              <tbody>{people.map((p) => <tr key={p.id}><td>{p.name || "—"}</td><td>{p.role || "—"}</td><td>{p.isAuditor ? `Auditor ${p.auditorLevel}` : "Personal"}</td><td>{(p.trainings || []).length}</td><td>{(p.certs || []).length}</td></tr>)}</tbody></table>
          </RepBlock>
        )}

        <RepBlock n={N()} title="Conclusión">
          <p className="rep-p">{conclusion}</p>
          <p className="rep-p faint">{coverageCaveat}</p>
        </RepBlock>

        <RepBlock n={N()} title="Aprobación y firmas">
          <table className="rep-tbl"><thead><tr><th>Rol</th><th>Nombre</th></tr></thead>
            <tbody>
              <tr><td>Elaborado por</td><td>{approvals.preparedBy || audit.leadAuditor || "—"}</td></tr>
              <tr><td>Revisado por</td><td>{approvals.reviewedBy || "—"}</td></tr>
              <tr><td>Aprobado por</td><td>{approvals.approvedBy || "—"}</td></tr>
              <tr><td>Estado del informe</td><td>{approvals.status}</td></tr>
            </tbody></table>
          <div className="rep-sign">
            <div>
              {approvals.sign ? <img src={approvals.sign} alt="Firma" style={{ maxHeight: 60, display: "block", margin: "0 auto 2px" }} /> : <span>{audit.leadAuditor || approvals.preparedBy || ""}</span>}
              Auditor líder
            </div>
            <div><span /> Representante de la organización</div>
          </div>
        </RepBlock>

        <div className="rep-foot">
          <p>Documento generado por el sistema de gestión de auditorías · Código {reportCode} · Emitido el {issueDate}</p>
          <p>AuditISO · PRO — Sistema de gestión de auditorías · Desarrollado por <b>Fernando Silva</b></p>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════ EJECUCIÓN (ISO 19011) */
function Ejecucion({ audit, execution, setExecution, metrics, standards, setTab, log }) {
  const ex = execution;
  const set = (k, v) => setExecution((e) => ({ ...e, [k]: v }));
  const setMeet = (which, k, v) => setExecution((e) => ({ ...e, [which]: { ...e[which], [k]: v } }));
  const addAtt = (which) => setExecution((e) => ({ ...e, [which]: { ...e[which], attendees: [...(e[which].attendees || []), emptyAttendee()] } }));
  const updAtt = (which, id, patch) => setExecution((e) => ({ ...e, [which]: { ...e[which], attendees: (e[which].attendees || []).map((a) => a.id === id ? { ...a, ...patch } : a) } }));
  const delAtt = (which, id) => setExecution((e) => ({ ...e, [which]: { ...e[which], attendees: (e[which].attendees || []).filter((a) => a.id !== id) } }));
  const setPhase = (id, st) => { setExecution((e) => ({ ...e, phases: { ...e.phases, [id]: e.phases?.[id] === st ? undefined : st } })); };
  const addEvid = () => { setExecution((e) => ({ ...e, evidence: [...(e.evidence || []), { ...emptyEvidence(), std: standards[0] || "" }] })); log && log("Evidencia registrada"); };
  const updEvid = (id, patch) => setExecution((e) => ({ ...e, evidence: (e.evidence || []).map((v) => v.id === id ? { ...v, ...patch } : v) }));
  const delEvid = (id) => setExecution((e) => ({ ...e, evidence: (e.evidence || []).filter((v) => v.id !== id) }));

  const groups = [...new Set(ISO19011_PHASES.map((p) => p.g))];
  const Meeting = ({ which, title, icon }) => {
    const m = ex[which] || { attendees: [] };
    return (
      <Card title={title} icon={icon}>
        <div className="fg3">
          <F label="Fecha"><input type="date" className="inp" value={m.date || ""} onChange={(e) => setMeet(which, "date", e.target.value)} /></F>
          <F label="Hora"><input type="time" className="inp" value={m.time || ""} onChange={(e) => setMeet(which, "time", e.target.value)} /></F>
          <F label="Asistentes"><div className="mini-metric mono">{(m.attendees || []).filter((a) => a.present).length} presente(s)</div></F>
        </div>
        <F label="Temas tratados / acuerdos" full><textarea className="inp" rows={2} value={m.notes || ""} onChange={(e) => setMeet(which, "notes", e.target.value)} placeholder={which === "opening" ? "Confirmación de objetivos, alcance, criterios, plan, canales de comunicación, confidencialidad…" : "Presentación de hallazgos, conclusiones, plazos de respuesta, divergencias…"} /></F>
        <div className="att-head"><span>Lista de asistencia</span><button className="btn sm" onClick={() => addAtt(which)}><Plus size={13} /> Añadir</button></div>
        {(m.attendees || []).length === 0 && <p className="hint">Sin asistentes registrados. La asistencia es un registro obligatorio de la reunión.</p>}
        {(m.attendees || []).map((a) => (
          <div key={a.id} className="att-row">
            <input className="inp" placeholder="Nombre y apellido" value={a.name} onChange={(e) => updAtt(which, a.id, { name: e.target.value })} />
            <input className="inp" placeholder="Cargo / función" value={a.role} onChange={(e) => updAtt(which, a.id, { role: e.target.value })} />
            <select className="inp" value={a.org} onChange={(e) => updAtt(which, a.id, { org: e.target.value })}>{ATT_ORG.map((o) => <option key={o} value={o}>{o}</option>)}</select>
            <label className="att-chk"><input type="checkbox" checked={!!a.present} onChange={(e) => updAtt(which, a.id, { present: e.target.checked })} /> Presente</label>
            <button className="icon-btn danger" onClick={() => delAtt(which, a.id)}><Trash2 size={13} /></button>
          </div>
        ))}
      </Card>
    );
  };

  return (
    <div className="wrap">
      <Head icon={FileCheck} title="Ejecución de la auditoría" sub="Plan formal, reuniones, muestreo y control del proceso según ISO 19011:2018" />

      {/* Barra de preparación */}
      <div className="panel">
        <div className="panel-h"><ClipboardCheck size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Avance del proceso de auditoría <span className="panel-h-note">{metrics.phasesDone + metrics.phasesNa}/{metrics.phasesTotal} fases · {metrics.readiness}%</span></div>
        <div className="ready-bar"><div className="ready-fill" style={{ width: `${metrics.readiness}%` }} /></div>
        <div className="ready-legend">
          <span className={metrics.openingDone ? "ok" : "no"}>{metrics.openingDone ? "✓" : "○"} Reunión de apertura</span>
          <span className={metrics.closingDone ? "ok" : "no"}>{metrics.closingDone ? "✓" : "○"} Reunión de cierre</span>
          <span className={metrics.pct === 100 ? "ok" : "no"}>{metrics.pct === 100 ? "✓" : "○"} Verificación 100%</span>
          <span className={metrics.phasesPending === 0 ? "ok" : "no"}>{metrics.phasesPending === 0 ? "✓" : "○"} Fases completas</span>
        </div>
      </div>

      {/* Plan de auditoría */}
      <Card title="Plan de auditoría (ISO 19011 §6.3)" icon={ClipboardList}>
        <div className="plan-ro">
          <div><span className="ro-l">Objetivos</span><p>{audit.objectives || <em className="miss">Sin definir — completa en Configuración</em>}</p></div>
          <div><span className="ro-l">Alcance</span><p>{audit.scope || <em className="miss">Sin definir</em>}</p></div>
          <div><span className="ro-l">Criterios</span><p>{audit.criteria || <em className="miss">Sin definir</em>}<br /><span className="mono faint">{standards.map((s) => STANDARDS[s].name).join(" · ")}</span></p></div>
          <div><span className="ro-l">Equipo auditor</span><p><b>Líder:</b> {audit.leadAuditor || <em className="miss">Sin designar</em>}{audit.team ? <><br /><b>Equipo:</b> {audit.team}</> : null}</p></div>
        </div>
        <button className="btn sm ghost" onClick={() => setTab("config")}><Settings size={13} /> Editar datos base en Configuración</button>
        <div className="fg2" style={{ marginTop: 12 }}>
          <F label="Representante del auditado"><input className="inp" value={ex.auditeeRep || ""} onChange={(e) => set("auditeeRep", e.target.value)} placeholder="Persona de contacto / anfitrión" /></F>
          <F label="Idioma de la auditoría"><input className="inp" value={ex.language || ""} onChange={(e) => set("language", e.target.value)} /></F>
          <F label="Logística" hint="Sitios, horarios, accesos, EPP requerido"><textarea className="inp" rows={2} value={ex.logistics || ""} onChange={(e) => set("logistics", e.target.value)} /></F>
          <F label="Recursos y disposiciones"><textarea className="inp" rows={2} value={ex.resources || ""} onChange={(e) => set("resources", e.target.value)} /></F>
          <F label="Confidencialidad" full><textarea className="inp" rows={2} value={ex.confidentiality || ""} onChange={(e) => set("confidentiality", e.target.value)} /></F>
          <F label="Imparcialidad e independencia" full><textarea className="inp" rows={2} value={ex.impartiality || ""} onChange={(e) => set("impartiality", e.target.value)} /></F>
          <F label="Distribución del informe" hint="A quién se entrega el informe final" full><input className="inp" value={ex.distribution || ""} onChange={(e) => set("distribution", e.target.value)} placeholder="Dirección, responsable del SG, organismo certificador…" /></F>
        </div>
      </Card>

      {/* Muestreo */}
      <Card title="Plan de muestreo" icon={Filter}>
        <div className="fg3">
          <F label="Método de muestreo"><select className="inp" value={ex.samplingMethod} onChange={(e) => set("samplingMethod", e.target.value)}>{SAMPLING_METHODS.map((m) => <option key={m}>{m}</option>)}</select></F>
          <F label="Tamaño / cobertura"><input className="inp" value={ex.samplingSize || ""} onChange={(e) => set("samplingSize", e.target.value)} placeholder="p. ej. 20 registros / 3 turnos" /></F>
          <F label="Justificación"><input className="inp" value={ex.samplingRationale || ""} onChange={(e) => set("samplingRationale", e.target.value)} placeholder="Criterio de representatividad" /></F>
        </div>
        <p className="hint">El muestreo no estadístico se basa en el juicio del auditor; documenta el criterio para que el hallazgo sea defendible.</p>
      </Card>

      {/* Reuniones */}
      <div className="fg2-cards">
        <Meeting which="opening" title="Reunión de apertura" icon={LogIn} />
        <Meeting which="closing" title="Reunión de cierre" icon={LogOut} />
      </div>

      {/* Fases ISO 19011 */}
      <Card title="Control del proceso · fases ISO 19011" icon={ListChecks}>
        <p className="hint" style={{ marginTop: 0 }}>Marca cada fase para no omitir ningún paso del proceso. Las fases no aplicables deben marcarse como N/A.</p>
        {groups.map((g) => (
          <div key={g} className="phase-group">
            <div className="phase-g-h mono">{g}</div>
            {ISO19011_PHASES.filter((p) => p.g === g).map((p) => {
              const cur = ex.phases?.[p.id];
              return (
                <div key={p.id} className={`phase-row${cur === "hecho" ? " done" : cur === "na" ? " na" : ""}`}>
                  <span className="phase-t">{p.t}</span>
                  <div className="phase-btns">
                    {Object.entries(PHASE_STATUS).map(([k, v]) => (
                      <button key={k} onClick={() => setPhase(p.id, k)} className="phase-b" style={cur === k ? { background: v.c, borderColor: v.c, color: "#08111c" } : { borderColor: "rgba(120,140,180,.25)", color: "#93a1b8" }}>{v.label}</button>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        ))}
      </Card>

      {/* Registro de evidencias y muestreo */}
      <Card title="Registro de evidencias y entrevistas" icon={Search}>
        <div className="att-head"><span>Fuente · método · muestra · resultado — respalda la trazabilidad de cada hallazgo</span><button className="btn sm" onClick={addEvid}><Plus size={13} /> Añadir evidencia</button></div>
        {(ex.evidence || []).length === 0 && <p className="hint">Sin evidencias registradas todavía.</p>}
        {(ex.evidence || []).length > 0 && (
          <div className="tbl-wrap">
            <table className="mini-tbl evid-tbl">
              <thead><tr><th>Norma</th><th>Cláusula</th><th>Fuente</th><th>Método</th><th>Muestra</th><th>Resultado</th><th></th></tr></thead>
              <tbody>
                {(ex.evidence || []).map((v) => (
                  <tr key={v.id}>
                    <td><select className="inp xs" value={v.std} onChange={(e) => updEvid(v.id, { std: e.target.value })}><option value="">—</option>{standards.map((s) => <option key={s} value={s}>{code(s)}</option>)}</select></td>
                    <td><input className="inp xs" value={v.clause} onChange={(e) => updEvid(v.id, { clause: e.target.value })} placeholder="8.5" /></td>
                    <td><input className="inp xs" value={v.source} onChange={(e) => updEvid(v.id, { source: e.target.value })} placeholder="Área / persona / doc." /></td>
                    <td><select className="inp xs" value={v.method} onChange={(e) => updEvid(v.id, { method: e.target.value })}>{EVID_METHODS.map((m) => <option key={m}>{m}</option>)}</select></td>
                    <td><input className="inp xs" value={v.sample} onChange={(e) => updEvid(v.id, { sample: e.target.value })} placeholder="Qué se revisó" /></td>
                    <td><input className="inp xs" value={v.result} onChange={(e) => updEvid(v.id, { result: e.target.value })} placeholder="Conforme / desviación" /></td>
                    <td><button className="icon-btn danger" onClick={() => delEvid(v.id)}><Trash2 size={13} /></button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════ PROGRAMA ANUAL */
function ProgramaAnual({ annual, setAnnual, log }) {
  const year = new Date().getFullYear();
  const add = () => { const r = emptyAnnual(); setAnnual((a) => [...a, r]); log && log("Auditoría añadida al programa anual"); };
  const upd = (id, k, v) => setAnnual((a) => a.map((r) => {
    if (r.id !== id) return r;
    if (log && k === "status" && r.status !== v) log("Cambio de estado de auditoría", `${r.area || "s/área"} → ${ANNUAL_STATUS[v]?.label || v}`);
    return { ...r, [k]: v };
  }));
  const del = (id) => { if (!confirm("¿Eliminar esta auditoría del programa anual?")) return; setAnnual((a) => a.filter((r) => r.id !== id)); log && log("Auditoría eliminada del programa anual"); };
  const done = annual.filter((a) => a.status === "realizada" || a.status === "cerrada").length;
  return (
    <div className="wrap">
      <Head icon={CalendarDays} title={`Programa anual de auditorías · ${year}`} sub="Cronograma de todas las auditorías internas y externas del año" />
      <div className="grid-3">
        <Stat icon={CalendarDays} tone="#2dd4bf" label="Auditorías programadas" value={annual.length} sub="En el año" />
        <Stat icon={CircleCheck} tone="#34d399" label="Ejecutadas" value={`${done}/${annual.length}`} sub="Realizadas o cerradas" />
        <Stat icon={AlertTriangle} tone="#fbbf24" label="Hallazgos acumulados" value={annual.reduce((s, a) => s + (Number(a.ncCount) || 0), 0)} sub="Reportados en el programa" />
      </div>

      <div className="panel">
        <div className="panel-h">Cronograma anual</div>
        <div className="chrono">
          <div className="chrono-head"><span className="chrono-area">Auditoría</span>{MONTHS.map((m) => <span key={m} className="chrono-m">{m}</span>)}</div>
          {annual.length === 0 && <div className="empty">Sin auditorías. Añade la primera al programa.</div>}
          {annual.map((r) => {
            const s = ANNUAL_STATUS[r.status] || ANNUAL_STATUS.programada;
            return (
              <div key={r.id} className="chrono-row">
                <span className="chrono-area" title={r.area}>{code(r.standard)} · {r.area || "s/n"}</span>
                {MONTHS.map((_, mi) => <span key={mi} className="chrono-cell">{mi === Number(r.month) && <em className="chrono-dot" style={{ background: s.c }} title={s.label} />}</span>)}
              </div>
            );
          })}
        </div>
      </div>

      <div className="panel nopad">
        <table className="tbl">
          <thead><tr><th>Área / proceso</th><th>Norma</th><th>Tipo</th><th>Mes</th><th>Fecha</th><th>Auditor</th><th>Estado</th><th>NC</th><th /></tr></thead>
          <tbody>
            {annual.length === 0 && <tr><td colSpan={9} className="empty">Sin filas.</td></tr>}
            {annual.map((r) => (
              <tr key={r.id}>
                <td><input className="cell" value={r.area} onChange={(e) => upd(r.id, "area", e.target.value)} placeholder="Compras, Producción…" /></td>
                <td><select className="cell" value={r.standard} onChange={(e) => upd(r.id, "standard", e.target.value)}>{Object.keys(STANDARDS).map((s) => <option key={s} value={s}>{code(s)}</option>)}</select></td>
                <td><select className="cell w-sm" value={r.type} onChange={(e) => upd(r.id, "type", e.target.value)}>{AUDIT_TYPES.map((x) => <option key={x}>{x}</option>)}</select></td>
                <td><select className="cell w-sm" value={r.month} onChange={(e) => upd(r.id, "month", Number(e.target.value))}>{MONTHS.map((m, i) => <option key={m} value={i}>{m}</option>)}</select></td>
                <td><input type="date" className="cell" value={r.plannedDate} onChange={(e) => upd(r.id, "plannedDate", e.target.value)} /></td>
                <td><input className="cell" value={r.auditor} onChange={(e) => upd(r.id, "auditor", e.target.value)} /></td>
                <td><select className="cell" value={r.status} onChange={(e) => upd(r.id, "status", e.target.value)} style={{ color: (ANNUAL_STATUS[r.status] || {}).c }}>{Object.entries(ANNUAL_STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}</select></td>
                <td><input className="cell w-xs" type="number" min="0" value={r.ncCount} onChange={(e) => upd(r.id, "ncCount", e.target.value)} /></td>
                <td className="ctr"><button onClick={() => del(r.id)} className="icon-del"><Trash2 size={15} /></button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <button onClick={add} className="btn"><Plus size={15} /> Añadir auditoría</button>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════ RIESGOS Y OPORTUNIDADES */
function Riesgos({ risks, setRisks, log }) {
  const [expanded, setExpanded] = useState(null);
  const [filter, setFilter] = useState("all");
  const add = () => { const r = emptyRisk(); setRisks((x) => [...x, r]); setExpanded(r.id); log && log("Riesgo/oportunidad registrado"); };
  const upd = (id, patch) => setRisks((x) => x.map((r) => (r.id === id ? { ...r, ...patch } : r)));
  const del = (id) => { if (!confirm("¿Eliminar este registro?")) return; setRisks((x) => x.filter((r) => r.id !== id)); log && log("Riesgo/oportunidad eliminado"); };
  const shown = risks.filter((r) => filter === "all" || r.kind === filter);
  // Matriz 5x5 (solo riesgos)
  const matrix = {};
  risks.filter((r) => r.kind === "Riesgo").forEach((r) => { const k = `${r.impact}-${r.prob}`; matrix[k] = (matrix[k] || 0) + 1; });
  return (
    <div className="wrap">
      <Head icon={Radar} title="Riesgos y oportunidades" sub="Identificación · evaluación probabilidad × impacto · planes de mitigación · seguimiento" />

      <div className="panel">
        <div className="panel-h">Mapa de calor de riesgos <span className="panel-h-note">impacto (filas) × probabilidad (columnas)</span></div>
        <div className="rmatrix">
          <div className="rm-corner" />
          {RISK_SCALE.map((p) => <div key={p.v} className="rm-top">{p.v}</div>)}
          {[5, 4, 3, 2, 1].map((imp) => (
            <React.Fragment key={imp}>
              <div className="rm-left">{imp}</div>
              {RISK_SCALE.map((p) => {
                const score = imp * p.v; const lv = riskLevel(score); const n = matrix[`${imp}-${p.v}`] || 0;
                return <div key={p.v} className="rm-cell" style={{ background: lv.bg, borderColor: lv.c + "55" }}>{n > 0 && <span className="rm-n mono" style={{ color: lv.c }}>{n}</span>}</div>;
              })}
            </React.Fragment>
          ))}
        </div>
      </div>

      <div className="hl-bar">
        <button onClick={() => setFilter("all")} className="hl-fil" style={filter === "all" ? { background: "#e6ecf5", color: "#08111c", borderColor: "#e6ecf5" } : {}}>Todos ({risks.length})</button>
        {RISK_KINDS.map((k) => <button key={k} onClick={() => setFilter(k)} className="hl-fil" style={filter === k ? { background: "#2dd4bf", color: "#08111c", borderColor: "#2dd4bf" } : {}}>{k}s</button>)}
        <button onClick={add} className="btn primary hl-add"><Plus size={15} /> Nuevo registro</button>
      </div>
      {shown.length === 0 && <div className="empty box">No hay registros en esta vista.</div>}
      <div className="hl-list">
        {shown.map((r) => {
          const score = r.prob * r.impact; const lv = riskLevel(score); const isOpen = expanded === r.id;
          const rScore = (r.residualProb || 0) * (r.residualImpact || 0);
          return (
            <div key={r.id} className="hl-item" style={{ borderColor: isOpen ? lv.c + "66" : "rgba(120,140,180,.14)" }}>
              <button className="hl-item-h" onClick={() => setExpanded(isOpen ? null : r.id)}>
                <span className="tag" style={{ color: lv.c, background: lv.bg, borderColor: lv.c + "66" }}>{r.kind === "Oportunidad" ? "OPORT." : lv.label}</span>
                <span className="hl-ref mono">{score}</span>
                <span className="hl-desc">{r.desc || "(descripción pendiente)"}</span>
                <span className="hl-st" style={{ color: "#8b98b0" }}>{r.status}</span>
                {isOpen ? <ChevronDown size={16} /> : <ChevronRight size={16} />}
              </button>
              {isOpen && (
                <div className="hl-body">
                  <div className="fg2">
                    <F label="Tipo"><select className="inp" value={r.kind} onChange={(e) => upd(r.id, { kind: e.target.value })}>{RISK_KINDS.map((k) => <option key={k}>{k}</option>)}</select></F>
                    <F label="Proceso / área"><input className="inp" value={r.process} onChange={(e) => upd(r.id, { process: e.target.value })} /></F>
                  </div>
                  <F label="Descripción"><textarea className="inp" rows={2} value={r.desc} onChange={(e) => upd(r.id, { desc: e.target.value })} /></F>
                  <div className="fg2">
                    <F label="Causa"><textarea className="inp" rows={2} value={r.cause} onChange={(e) => upd(r.id, { cause: e.target.value })} /></F>
                    <F label="Efecto / consecuencia"><textarea className="inp" rows={2} value={r.effect} onChange={(e) => upd(r.id, { effect: e.target.value })} /></F>
                  </div>
                  <div className="risk-eval">
                    <F label="Probabilidad"><select className="inp" value={r.prob} onChange={(e) => upd(r.id, { prob: Number(e.target.value) })}>{RISK_SCALE.map((s) => <option key={s.v} value={s.v}>{s.v} · {s.label}</option>)}</select></F>
                    <F label="Impacto"><select className="inp" value={r.impact} onChange={(e) => upd(r.id, { impact: Number(e.target.value) })}>{RISK_SCALE.map((s) => <option key={s.v} value={s.v}>{s.v} · {s.label}</option>)}</select></F>
                    <div className="risk-score"><span className="risk-score-n mono" style={{ color: lv.c }}>{score}</span><span className="risk-score-l" style={{ color: lv.c }}>{lv.label}</span></div>
                  </div>
                  <F label="Tratamiento / control" hint="Evitar, mitigar, transferir o aceptar"><input className="inp" value={r.treatment} onChange={(e) => upd(r.id, { treatment: e.target.value })} /></F>
                  <F label="Plan de mitigación / acción"><textarea className="inp" rows={2} value={r.plan} onChange={(e) => upd(r.id, { plan: e.target.value })} /></F>
                  <div className="fg3">
                    <F label="Responsable"><input className="inp" value={r.owner} onChange={(e) => upd(r.id, { owner: e.target.value })} /></F>
                    <F label="Fecha compromiso"><input type="date" className="inp" value={r.due} onChange={(e) => upd(r.id, { due: e.target.value })} /></F>
                    <F label="Estado"><select className="inp" value={r.status} onChange={(e) => upd(r.id, { status: e.target.value })}>{RISK_STATUS.map((s) => <option key={s}>{s}</option>)}</select></F>
                  </div>
                  <div className="risk-eval">
                    <F label="Prob. residual"><select className="inp" value={r.residualProb || 0} onChange={(e) => upd(r.id, { residualProb: Number(e.target.value) })}><option value={0}>—</option>{RISK_SCALE.map((s) => <option key={s.v} value={s.v}>{s.v}</option>)}</select></F>
                    <F label="Impacto residual"><select className="inp" value={r.residualImpact || 0} onChange={(e) => upd(r.id, { residualImpact: Number(e.target.value) })}><option value={0}>—</option>{RISK_SCALE.map((s) => <option key={s.v} value={s.v}>{s.v}</option>)}</select></F>
                    <div className="risk-score"><span className="risk-score-n mono" style={{ color: rScore ? riskLevel(rScore).c : "#5e6d86" }}>{rScore || "—"}</span><span className="risk-score-l">residual</span></div>
                  </div>
                  <div className="hl-del"><button onClick={() => del(r.id)} className="btn ghost-danger"><Trash2 size={14} /> Eliminar</button></div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════ GESTIÓN DOCUMENTAL */
function Documentos({ documents, setDocuments, currentUser, log }) {
  const [expanded, setExpanded] = useState(null);
  const [q, setQ] = useState("");
  const add = () => { const d = emptyDoc(); d.history = [{ v: "1.0", date: todayStr(), by: currentUser, note: "Creación del documento" }]; setDocuments((x) => [...x, d]); setExpanded(d.id); log && log("Documento creado"); };
  const upd = (id, patch) => setDocuments((x) => x.map((d) => (d.id === id ? { ...d, ...patch } : d)));
  const del = (id) => { if (!confirm("¿Eliminar este documento del control documental?")) return; setDocuments((x) => x.filter((d) => d.id !== id)); log && log("Documento eliminado"); };
  const bumpVersion = (d) => {
    const note = prompt("Describe el cambio de esta nueva versión:", "");
    if (note === null) return;
    const parts = (d.version || "1.0").split("."); const major = parts[0] || "1"; const minor = (parseInt(parts[1] || "0", 10) + 1);
    const nv = `${major}.${minor}`;
    upd(d.id, { version: nv, status: "revision", history: [...(d.history || []), { v: nv, date: todayStr(), by: currentUser, note: note || "Actualización" }] });
    log && log("Nueva versión de documento", `${d.code || d.title} v${nv}`);
  };
  const approve = (d) => {
    upd(d.id, { status: "aprobado", approvedDate: todayStr(), approver: d.approver || currentUser, history: [...(d.history || []), { v: d.version, date: todayStr(), by: d.approver || currentUser, note: "Aprobado" }] });
    log && log("Documento aprobado", `${d.code || d.title} v${d.version}`);
  };
  const shown = documents.filter((d) => !q || (d.code + d.title + d.type).toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="wrap">
      <Head icon={Folder} title="Gestión documental" sub="Control de versiones · aprobación · historial de cambios · acceso controlado" />
      <div className="cl-bar">
        <div className="cl-search"><Search size={15} /><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Buscar por código, título o tipo…" /></div>
        <button onClick={add} className="btn primary"><Plus size={15} /> Nuevo documento</button>
      </div>
      {documents.length === 0 && <div className="empty box">Sin documentos. Registra políticas, procedimientos, instructivos y formatos.</div>}
      <div className="hl-list">
        {shown.map((d) => {
          const st = DOC_STATUS[d.status] || DOC_STATUS.borrador; const isOpen = expanded === d.id;
          const reviewOverdue = d.status === "aprobado" && d.nextReview && d.nextReview < todayStr();
          return (
            <div key={d.id} className="hl-item" style={{ borderColor: isOpen ? st.c + "55" : "rgba(120,140,180,.14)" }}>
              <button className="hl-item-h" onClick={() => setExpanded(isOpen ? null : d.id)}>
                <span className="tag" style={{ color: st.c, background: st.c + "22", borderColor: st.c + "55" }}>{st.label}</span>
                <span className="hl-ref mono">{d.code || "s/cód"} · v{d.version}</span>
                <span className="hl-desc">{d.title || "(sin título)"} <em className="doc-type">{d.type}</em></span>
                {reviewOverdue && <span className="hl-st" style={{ color: "#f87171" }}>Revisión vencida</span>}
                {isOpen ? <ChevronDown size={16} /> : <ChevronRight size={16} />}
              </button>
              {isOpen && (
                <div className="hl-body">
                  <div className="fg3">
                    <F label="Código"><input className="inp" value={d.code} onChange={(e) => upd(d.id, { code: e.target.value })} placeholder="P-CAL-001" /></F>
                    <F label="Tipo"><select className="inp" value={d.type} onChange={(e) => upd(d.id, { type: e.target.value })}>{DOC_TYPES.map((t) => <option key={t}>{t}</option>)}</select></F>
                    <F label="Nivel de acceso"><select className="inp" value={d.access} onChange={(e) => upd(d.id, { access: e.target.value })}>{DOC_ACCESS.map((a) => <option key={a}>{a}</option>)}</select></F>
                  </div>
                  <F label="Título"><input className="inp" value={d.title} onChange={(e) => upd(d.id, { title: e.target.value })} /></F>
                  <div className="fg3">
                    <F label="Versión vigente"><input className="inp" value={d.version} onChange={(e) => upd(d.id, { version: e.target.value })} /></F>
                    <F label="Responsable / autor"><input className="inp" value={d.owner} onChange={(e) => upd(d.id, { owner: e.target.value })} /></F>
                    <F label="Aprobador"><input className="inp" value={d.approver} onChange={(e) => upd(d.id, { approver: e.target.value })} /></F>
                  </div>
                  <div className="fg3">
                    <F label="Estado"><select className="inp" value={d.status} onChange={(e) => upd(d.id, { status: e.target.value })}>{Object.entries(DOC_STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}</select></F>
                    <F label="Fecha aprobación"><input type="date" className="inp" value={d.approvedDate} onChange={(e) => upd(d.id, { approvedDate: e.target.value })} /></F>
                    <F label="Próxima revisión"><input type="date" className="inp" value={d.nextReview} onChange={(e) => upd(d.id, { nextReview: e.target.value })} /></F>
                  </div>
                  <F label="Enlace / ubicación" hint="Ruta en repositorio, SharePoint, unidad, etc."><input className="inp" value={d.link} onChange={(e) => upd(d.id, { link: e.target.value })} /></F>
                  <div className="doc-actions">
                    <button onClick={() => bumpVersion(d)} className="btn"><GitBranch size={14} /> Nueva versión</button>
                    {d.status !== "aprobado" && <button onClick={() => approve(d)} className="btn primary"><FileCheck size={14} /> Aprobar</button>}
                  </div>
                  <div className="sub-panel">
                    <div className="sub-h"><History size={15} /> Historial de cambios</div>
                    <table className="mini-tbl">
                      <thead><tr><th>Versión</th><th>Fecha</th><th>Por</th><th>Cambio</th></tr></thead>
                      <tbody>{(d.history || []).slice().reverse().map((h, i) => <tr key={i}><td className="mono">v{h.v}</td><td>{h.date}</td><td>{h.by || "—"}</td><td>{h.note}</td></tr>)}</tbody>
                    </table>
                  </div>
                  <div className="hl-del"><button onClick={() => del(d.id)} className="btn ghost-danger"><Trash2 size={14} /> Eliminar</button></div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════ COMPETENCIAS */
function Competencias({ people, setPeople, log }) {
  const [expanded, setExpanded] = useState(null);
  const add = () => { const p = emptyPerson(); setPeople((x) => [...x, p]); setExpanded(p.id); log && log("Persona registrada en competencias"); };
  const upd = (id, patch) => setPeople((x) => x.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  const del = (id) => { if (!confirm("¿Eliminar a esta persona del registro de competencias?")) return; setPeople((x) => x.filter((p) => p.id !== id)); log && log("Persona eliminada de competencias"); };
  const addSub = (p, field, obj) => upd(p.id, { [field]: [...(p[field] || []), obj] });
  const updSub = (p, field, i, patch) => upd(p.id, { [field]: (p[field] || []).map((it, idx) => (idx === i ? { ...it, ...patch } : it)) });
  const delSub = (p, field, i) => upd(p.id, { [field]: (p[field] || []).filter((_, idx) => idx !== i) });
  return (
    <div className="wrap">
      <Head icon={Award} title="Gestión de competencias" sub="Formación · evaluación de competencias · certificaciones · calificación de auditores" />
      <div className="cl-bar">
        <div className="cl-caption">Personal registrado: <b>{people.length}</b> · Auditores: <b>{people.filter((p) => p.isAuditor).length}</b></div>
        <button onClick={add} className="btn primary"><Plus size={15} /> Añadir persona</button>
      </div>
      {people.length === 0 && <div className="empty box">Sin registros. Añade al personal y a los auditores del sistema.</div>}
      <div className="hl-list">
        {people.map((p) => {
          const isOpen = expanded === p.id;
          const gap = (p.evals || []).some((e) => e.result !== "Competente");
          return (
            <div key={p.id} className="hl-item" style={{ borderColor: isOpen ? "rgba(45,212,191,.4)" : "rgba(120,140,180,.14)" }}>
              <button className="hl-item-h" onClick={() => setExpanded(isOpen ? null : p.id)}>
                {p.isAuditor ? <span className="tag" style={{ color: "#c084fc", background: "rgba(192,132,252,.14)", borderColor: "rgba(192,132,252,.4)" }}>Auditor · {p.auditorLevel}</span> : <span className="tag" style={{ color: "#93a1b8", background: "rgba(147,161,184,.12)", borderColor: "rgba(147,161,184,.3)" }}>Personal</span>}
                <span className="hl-desc">{p.name || "(sin nombre)"} <em className="doc-type">{p.role}</em></span>
                {gap && <span className="hl-st" style={{ color: "#fbbf24" }}>Brecha</span>}
                {isOpen ? <ChevronDown size={16} /> : <ChevronRight size={16} />}
              </button>
              {isOpen && (
                <div className="hl-body">
                  <div className="fg3">
                    <F label="Nombre"><input className="inp" value={p.name} onChange={(e) => upd(p.id, { name: e.target.value })} /></F>
                    <F label="Cargo"><input className="inp" value={p.role} onChange={(e) => upd(p.id, { role: e.target.value })} /></F>
                    <F label="Área"><input className="inp" value={p.area} onChange={(e) => upd(p.id, { area: e.target.value })} /></F>
                  </div>
                  <label className="std-opt" style={{ maxWidth: 320 }}><input type="checkbox" checked={p.isAuditor} onChange={(e) => upd(p.id, { isAuditor: e.target.checked })} /><span><b>Es auditor</b><em>Habilita calificación de auditor</em></span></label>
                  {p.isAuditor && (
                    <div className="fg2" style={{ marginTop: 10 }}>
                      <F label="Nivel de auditor"><select className="inp" value={p.auditorLevel} onChange={(e) => upd(p.id, { auditorLevel: e.target.value })}>{AUDITOR_LEVELS.map((l) => <option key={l}>{l}</option>)}</select></F>
                      <F label="Normas que puede auditar"><input className="inp" value={p.auditorStandards} onChange={(e) => upd(p.id, { auditorStandards: e.target.value })} placeholder="ISO 9001, ISO 14001…" /></F>
                    </div>
                  )}

                  <SubList title="Capacitaciones" icon={BookOpen} items={p.trainings} cols={[{ k: "name", ph: "Curso / tema" }, { k: "date", ph: "Fecha", type: "date", w: 150 }, { k: "hours", ph: "Horas", w: 80 }, { k: "provider", ph: "Proveedor" }]}
                    onAdd={() => addSub(p, "trainings", { name: "", date: "", hours: "", provider: "" })} onUpd={(i, patch) => updSub(p, "trainings", i, patch)} onDel={(i) => delSub(p, "trainings", i)} />

                  <SubList title="Evaluación de competencias" icon={ClipboardCheck} items={p.evals} cols={[{ k: "date", ph: "Fecha", type: "date", w: 150 }, { k: "competence", ph: "Competencia evaluada" }, { k: "result", ph: "Resultado", select: EVAL_RESULT, w: 200 }, { k: "note", ph: "Observación" }]}
                    onAdd={() => addSub(p, "evals", { date: "", competence: "", result: "Competente", note: "" })} onUpd={(i, patch) => updSub(p, "evals", i, patch)} onDel={(i) => delSub(p, "evals", i)} />

                  <SubList title="Certificaciones" icon={Award} items={p.certs} cols={[{ k: "name", ph: "Certificación" }, { k: "issuer", ph: "Entidad" }, { k: "date", ph: "Emisión", type: "date", w: 150 }, { k: "expiry", ph: "Vence", type: "date", w: 150 }]}
                    onAdd={() => addSub(p, "certs", { name: "", issuer: "", date: "", expiry: "" })} onUpd={(i, patch) => updSub(p, "certs", i, patch)} onDel={(i) => delSub(p, "certs", i)} />

                  <div className="hl-del"><button onClick={() => del(p.id)} className="btn ghost-danger"><Trash2 size={14} /> Eliminar persona</button></div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}
function SubList({ title, icon: Icon, items, cols, onAdd, onUpd, onDel }) {
  const today = todayStr();
  return (
    <div className="sub-panel">
      <div className="sub-h"><Icon size={15} /> {title}</div>
      <table className="mini-tbl">
        <thead><tr>{cols.map((c) => <th key={c.k} style={c.w ? { width: c.w } : {}}>{c.ph}</th>)}<th /></tr></thead>
        <tbody>
          {(!items || items.length === 0) && <tr><td colSpan={cols.length + 1} className="empty" style={{ padding: 10 }}>Sin registros.</td></tr>}
          {(items || []).map((it, i) => {
            const expiring = it.expiry && daysBetween(it.expiry, today) <= 60;
            return (
              <tr key={i}>
                {cols.map((c) => (
                  <td key={c.k}>
                    {c.select ? <select className="cell" value={it[c.k] || ""} onChange={(e) => onUpd(i, { [c.k]: e.target.value })} style={c.k === "result" ? { color: it.result === "Competente" ? "#34d399" : "#fbbf24" } : {}}>{c.select.map((o) => <option key={o}>{o}</option>)}</select>
                      : <input className="cell" type={c.type || "text"} value={it[c.k] || ""} placeholder={c.ph} onChange={(e) => onUpd(i, { [c.k]: e.target.value })} style={c.k === "expiry" && expiring ? { color: "#f87171" } : {}} />}
                  </td>
                ))}
                <td className="ctr"><button onClick={() => onDel(i)} className="icon-del"><Trash2 size={14} /></button></td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <button onClick={onAdd} className="btn sm"><Plus size={13} /> Añadir</button>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════ TRAZABILIDAD */
function Trazabilidad({ trail, setTrail, currentUser }) {
  const [q, setQ] = useState("");
  const shown = trail.filter((t) => !q || (t.action + t.detail + t.user).toLowerCase().includes(q.toLowerCase()));
  const clearAll = () => { if (!confirm("¿Vaciar el registro de trazabilidad? Esta acción no se puede deshacer.")) return; setTrail([]); };
  const exportTrail = () => {
    const rows = [["Fecha y hora", "Usuario", "Acción", "Detalle"], ...trail.map((t) => [new Date(t.ts).toLocaleString("es-ES"), t.user, t.action, t.detail])];
    const csv = rows.map((r) => r.map((c) => `"${String(c || "").replace(/"/g, '""')}"`).join(";")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = "trazabilidad_auditoria.csv"; a.click(); URL.revokeObjectURL(url);
  };
  return (
    <div className="wrap">
      <Head icon={History} title="Trazabilidad completa" sub="Registro de auditoría del sistema: quién hizo qué y cuándo" />
      <div className="cl-bar">
        <div className="cl-search"><Search size={15} /><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Buscar en el registro…" /></div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={exportTrail} className="btn"><Download size={14} /> Exportar CSV</button>
          <button onClick={clearAll} className="btn ghost-danger"><Trash2 size={14} /> Vaciar</button>
        </div>
      </div>
      <div className="cl-caption" style={{ marginBottom: 10 }}>Usuario actual: <b>{currentUser}</b> · Eventos registrados: <b>{trail.length}</b> <span className="faint">(puedes cambiar el usuario en Configuración)</span></div>
      {trail.length === 0 && <div className="empty box">Aún no hay eventos. Las acciones sobre hallazgos, riesgos, documentos, competencias y el programa quedarán registradas aquí.</div>}
      {trail.length > 0 && (
        <div className="panel nopad">
          <table className="tbl">
            <thead><tr><th style={{ width: 180 }}>Fecha y hora</th><th style={{ width: 140 }}>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead>
            <tbody>
              {shown.map((t) => (
                <tr key={t.id}>
                  <td className="mono faint" style={{ fontSize: 12 }}>{new Date(t.ts).toLocaleString("es-ES", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" })}</td>
                  <td>{t.user}</td>
                  <td><span className="trail-act">{t.action}</span></td>
                  <td className="faint">{t.detail || "—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════ FIRMA ELECTRÓNICA */
function SignaturePad({ value, onChange }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  useEffect(() => {
    const c = canvasRef.current; if (!c) return;
    const ctx = c.getContext("2d");
    ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.strokeStyle = "#0b1220";
    if (value) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = value; }
  }, []); // eslint-disable-line
  const pos = (e) => { const r = canvasRef.current.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: t.clientX - r.left, y: t.clientY - r.top }; };
  const start = (e) => { e.preventDefault(); drawing.current = true; const ctx = canvasRef.current.getContext("2d"); const { x, y } = pos(e); ctx.beginPath(); ctx.moveTo(x, y); };
  const move = (e) => { if (!drawing.current) return; e.preventDefault(); const ctx = canvasRef.current.getContext("2d"); const { x, y } = pos(e); ctx.lineTo(x, y); ctx.stroke(); };
  const end = () => { if (!drawing.current) return; drawing.current = false; onChange(canvasRef.current.toDataURL("image/png")); };
  const clear = () => { const c = canvasRef.current; c.getContext("2d").clearRect(0, 0, c.width, c.height); onChange(""); };
  return (
    <div className="sign-pad">
      <canvas ref={canvasRef} width={340} height={120} className="sign-canvas"
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end} />
      <button onClick={clear} className="btn sm ghost-danger"><RotateCcw size={13} /> Borrar firma</button>
    </div>
  );
}

function Card({ title, icon: Icon, children, className }) { return (<div className={`card${className ? " " + className : ""}`}><div className="card-h">{Icon && <Icon size={15} />}<span>{title}</span></div>{children}</div>); }
function F({ label, children, hint, full }) { return (<label className={`f${full ? " full" : ""}`}><span className="f-l">{label}</span>{children}{hint && <span className="f-h">{hint}</span>}</label>); }
function RepBlock({ n, title, children }) { return (<section className="rep-block"><h3><em className="mono">{n}</em> {title}</h3>{children}</section>); }
function R({ k, v }) { return (<div className="rep-r"><dt>{k}</dt><dd>{v || "—"}</dd></div>); }

.rep-badge{display:inline-block;font-size:9.5px;letter-spacing:.12em;font-weight:700;color:var(--acc);border:1px solid rgba(45,212,191,.35);background:rgba(45,212,191,.08);border-radius:999px;padding:3px 11px;margin-bottom:10px}
.rep-head h1{margin:0;font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700}
.rep-org{margin:8px 0 0;font-size:14px;font-weight:600;color:var(--txt)}
.rep-head p.mono{margin:6px 0 0;font-size:12px;color:var(--acc)}
.rep-ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:26px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rep-ctrl > div{padding:10px 14px;border-left:1px solid var(--line)}.rep-ctrl > div:first-child{border-left:none}
.rep-ctrl dt{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 3px}
.rep-ctrl dd{font-size:12.5px;font-weight:600;margin:0;color:var(--txt)}
.rep-block{margin-bottom:24px}
.rep-block h3{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:9px}
.rep-block h3 em{font-style:normal;font-size:11px;color:#06121a;background:var(--acc);width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-weight:600}
.rep-dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px;margin:0 0 12px}
.rep-r{display:flex;gap:7px;font-size:13px}.rep-r dt{color:var(--mut)}.rep-r dd{margin:0;font-weight:600}
.rep-p{font-size:13px;line-height:1.6;margin:4px 0;color:var(--txt)}.rep-p.faint{color:var(--faint)}
.rep-cls{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:12px}
.rep-cls-c{border:1px solid;border-radius:10px;padding:11px;text-align:center}.rep-cls-c b{display:block;font-family:'JetBrains Mono',monospace;font-size:22px}.rep-cls-c span{font-size:10px;color:var(--mut)}
.rep-tbl{width:100%;border-collapse:collapse;font-size:12.5px}.rep-tbl th{text-align:left;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line2)}.rep-tbl td{padding:6px 8px;border-bottom:1px solid var(--line)}
.rep-fg{margin-bottom:16px}.rep-fg h4{font-size:13px;margin:0 0 8px;font-weight:600}
.rep-f{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;font-size:13px;line-height:1.55}
.rep-f-h{font-size:11px;color:var(--mut);margin-bottom:5px}
.rep-sm{font-size:11.5px;color:var(--mut);margin:4px 0 0}
.rep-rc{margin-top:8px;padding:9px 11px;border-radius:8px;background:var(--surf2);font-size:11.5px;color:var(--mut);line-height:1.6}
.rep-sign{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:34px}
.rep-sign div{border-top:1px solid var(--line2);padding-top:6px;text-align:center;font-size:11.5px;color:var(--mut)}
.rep-sign span{display:block;color:var(--txt);font-weight:600;min-height:18px;margin-bottom:2px}
.rep-foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:11px;color:var(--faint)}.rep-foot b{color:var(--acc)}.rep-foot p{margin:2px 0}

@media (max-width:820px){
  .ai-rail{display:none}.ai-mobilenav{display:block;background:var(--surf2);border:1px solid var(--line2);border-radius:8px;color:var(--txt);padding:7px 10px;font-size:13px;font-family:inherit}
  .grid-3{grid-template-columns:1fr}.cls-grid{grid-template-columns:repeat(3,1fr)}.rep-cls{grid-template-columns:repeat(3,1fr)}
  .fg2,.fg3,.std-grid,.cl-notes,.rep-dl{grid-template-columns:1fr}.ai-top-right{margin-left:0;width:100%;justify-content:space-between}
  .ai-clock-time{font-size:17px}
}
/* ── KPIs secundarios ── */
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.mini-stat{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surf);cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.mini-stat:hover{border-color:var(--line2);transform:translateY(-1px)}
.mini-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.mini-n{font-size:20px;font-weight:700;line-height:1}
.mini-l{font-size:11px;color:var(--mut);line-height:1.25}
.panel-h-note{font-weight:400;font-size:11px;color:var(--faint);margin-left:8px;text-transform:none;letter-spacing:0}
/* ── Alertas ── */
.alert-list{display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.alert-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border:1px solid var(--line);border-radius:10px}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.alert-txt{flex:1;font-size:13px;color:var(--txt);line-height:1.45}
.alert-lv{font-size:9.5px;font-weight:700;letter-spacing:.05em;font-family:'JetBrains Mono',monospace}
/* ── Tendencia ── */
.trend{display:flex;align-items:flex-end;gap:14px;height:150px;padding:14px 8px 0}
.trend-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%}
.trend-bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.trend-bar{width:70%;min-height:3px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#2dd4bf,#38bdf8);position:relative;transition:height .3s}
.trend-v{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--txt)}
.trend-x{font-size:11px;color:var(--mut)}
/* ── Cronograma anual ── */
.chrono{overflow-x:auto;padding:4px 2px}
.chrono-head,.chrono-row{display:grid;grid-template-columns:180px repeat(12,1fr);align-items:center;min-width:640px}
.chrono-head{padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.chrono-m{font-size:10.5px;color:var(--faint);text-align:center}
.chrono-area{font-size:12px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.chrono-row{padding:6px 0;border-bottom:1px solid rgba(120,140,180,.07)}
.chrono-cell{display:grid;place-items:center}
.chrono-dot{width:12px;height:12px;border-radius:50%;display:block}
/* ── Matriz de riesgos ── */
.rmatrix{display:grid;grid-template-columns:34px repeat(5,1fr);gap:5px;max-width:460px}
.rm-corner{}.rm-top,.rm-left{display:grid;place-items:center;font-size:11px;color:var(--mut);font-family:'JetBrains Mono',monospace}
.rm-cell{aspect-ratio:1.7;border:1px solid;border-radius:7px;display:grid;place-items:center}
.rm-n{font-size:14px;font-weight:700}
.risk-eval{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end;margin:6px 0}
.risk-score{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 14px;border:1px solid var(--line2);border-radius:10px;min-width:88px}
.risk-score-n{font-size:24px;font-weight:700;line-height:1}
.risk-score-l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
/* ── Documentos / competencias ── */
.doc-type{font-style:normal;font-size:11px;color:var(--faint);margin-left:6px}
.doc-actions{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.mini-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.mini-tbl th{text-align:left;color:var(--faint);font-weight:500;padding:5px 8px;border-bottom:1px solid var(--line);font-size:11px}
.mini-tbl td{padding:3px 6px;border-bottom:1px solid rgba(120,140,180,.07);vertical-align:middle}
.mini-tbl td .cell{padding:5px 7px}
.capa-badge{margin-left:auto;font-size:10.5px;font-weight:600;border:1px solid;border-radius:999px;padding:2px 10px}
.capa-close{margin-top:8px;padding-top:10px;border-top:1px dashed var(--line2)}
.cl-caption{font-size:13px;color:var(--mut)}.cl-caption b{color:var(--txt)}
.w-xs{width:56px}
/* ── Trazabilidad ── */
.trail-act{font-size:12.5px;color:var(--txt);font-weight:500}
/* ── Firma ── */
.sign-pad{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sign-canvas{background:#fff;border:1px solid var(--line2);border-radius:8px;touch-action:none;cursor:crosshair;width:340px;max-width:100%}
/* ── Botón pequeño ── */
.btn.sm{padding:6px 11px;font-size:12px}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--muted)}
.btn.ghost:hover{color:var(--txt);border-color:var(--acc)}
/* ── Ejecución: barra de preparación ── */
.ready-bar{height:8px;border-radius:999px;background:rgba(120,140,180,.14);overflow:hidden;margin:2px 0 10px}
.ready-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:999px;transition:width .4s}
.ready-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px}
.ready-legend .ok{color:#34d399}.ready-legend .no{color:var(--faint)}
/* ── Plan (solo lectura) ── */
.plan-ro{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-bottom:12px}
.plan-ro .ro-l{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.plan-ro p{margin:0;font-size:13px;line-height:1.5;color:var(--txt)}
.miss{color:#fbbf24;font-style:italic;font-size:12px}
.fg3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fg2-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.fg2-cards .card{margin-bottom:0}
.mini-metric{padding:9px 11px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:12.5px}
/* ── Asistencia ── */
.att-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 8px;font-size:12px;color:var(--muted)}
.att-row{display:grid;grid-template-columns:1.3fr 1.1fr .9fr auto auto;gap:8px;align-items:center;margin-bottom:7px}
.att-chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.icon-btn{background:transparent;border:1px solid var(--line2);color:var(--muted);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer}
.icon-btn.danger:hover{color:#f87171;border-color:rgba(248,113,113,.4)}
/* ── Fases ── */
.phase-group{margin-bottom:14px}
.phase-g-h{font-size:11px;letter-spacing:.06em;color:var(--acc);margin:0 0 7px;font-weight:600}
.phase-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:rgba(255,255,255,.01)}
.phase-row.done{border-color:rgba(52,211,153,.32);background:rgba(52,211,153,.05)}
.phase-row.na{opacity:.6}
.phase-t{font-size:12.5px;color:var(--txt);line-height:1.4}
.phase-btns{display:flex;gap:5px;flex-shrink:0}
.phase-b{padding:4px 9px;border-radius:7px;border:1px solid;background:transparent;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
/* ── Cobertura (checklist) ── */
.cov{margin-bottom:14px}
.cov-bar{height:7px;border-radius:999px;background:rgba(120,140,180,.14);overflow:hidden;margin-bottom:8px}
.cov-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.cov-stats{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12px}
.cov-pct{font-size:15px;font-weight:700;color:var(--txt)}
.cov-chip{font-weight:600}
.cov-warn{color:#fbbf24;font-weight:600}
.na-warn{color:#fbbf24;font-size:11.5px;margin:6px 0 0}
.inp.warn{border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.05)}
.inp.xs{padding:5px 7px;font-size:12px}
.tbl-wrap{overflow-x:auto}
.evid-tbl th,.evid-tbl td{padding:4px 6px;white-space:nowrap}
.evid-tbl .inp.xs{min-width:96px}
/* ── Análisis ── */
.an-kpi{grid-template-columns:repeat(6,1fr)}
.an-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.an-grid .card{margin-bottom:0}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.bar-row{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center}
.bar-lab{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:16px;background:rgba(120,140,180,.12);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;min-width:2px;transition:width .4s}
.bar-val{font-size:12px;color:var(--txt);text-align:right}
.pareto{width:100%;height:auto;min-width:420px}
.hl-del{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* ── Plan y agenda ── */
.pa-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.empty-box{border:1px dashed var(--line2);border-radius:12px;padding:26px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.day-block{margin-bottom:22px}
.day-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;color:var(--acc)}
.day-date{width:auto;min-width:170px;font-weight:600}
.day-tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#08111c;background:var(--acc);padding:3px 9px;border-radius:999px}
.day-count{font-size:12px;color:var(--faint);margin-left:auto}
.sch-tbl .w-sm{width:76px}
/* ── Asistente IA ── */
.ai-status{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.ai-status .btn{margin-left:auto}
.ai-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ai-dot.on{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.ai-dot.off{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.15)}
.ai-cfg-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.ai-link{display:inline-flex;align-items:center;gap:6px;color:var(--acc);font-size:12.5px;font-weight:600;text-decoration:none}
.ai-link:hover{text-decoration:underline}
.ai-tiers{font-size:11.5px;color:var(--faint)}
.ai-warn{background:rgba(45,212,191,.06);border:1px solid rgba(45,212,191,.18);border-radius:8px;padding:9px 11px;margin-top:8px}
.ai-chat{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.015);overflow:hidden;display:flex;flex-direction:column;margin-bottom:12px}
.ai-msgs{max-height:52vh;min-height:280px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.ai-empty{margin:auto;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px;max-width:560px}
.ai-empty svg{color:var(--acc);opacity:.8}
.ai-quick{display:flex;flex-direction:column;gap:7px;width:100%;margin-top:4px}
.ai-chip{text-align:left;background:rgba(120,140,180,.07);border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--txt);font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
.ai-chip:hover{border-color:var(--acc);background:rgba(45,212,191,.06)}
.ai-msg{display:flex;gap:10px;align-items:flex-start}
.ai-msg.user{flex-direction:row-reverse}
.ai-av{flex-shrink:0;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--panel2,rgba(120,140,180,.12));color:var(--acc)}
.ai-msg.user .ai-av{background:var(--acc);color:#08111c}
.ai-bubble{max-width:80%;background:rgba(120,140,180,.09);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:13.5px;line-height:1.55}
.ai-msg.user .ai-bubble{background:rgba(45,212,191,.1);border-color:rgba(45,212,191,.28)}
.ai-bubble p{margin:0 0 4px}.ai-bubble p:last-child{margin:0}
.ai-typing{display:flex;gap:4px;align-items:center}
.ai-typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:aiblink 1.2s infinite both}
.ai-typing span:nth-child(2){animation-delay:.2s}.ai-typing span:nth-child(3){animation-delay:.4s}
@keyframes aiblink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.ai-err{color:#f87171;font-size:12.5px;padding:0 16px}
.ai-input{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ai-input textarea{resize:none}
.ai-input-btns{display:flex;justify-content:flex-end;gap:8px}
/* ── Recomendación IAF/EA ── */
.iaf-rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:9px}
.iaf-rec-l{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--acc);font-weight:600}
.iaf-chip{background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.3);color:var(--txt);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.iaf-chip:hover{background:rgba(45,212,191,.16)}
.iaf-chip.on{background:var(--acc);color:#08111c;border-color:var(--acc);font-weight:600}
/* ── Desplegable propio (IAF) ── */
.sel{position:relative}
.sel-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--fld,rgba(120,140,180,.06));border:1px solid var(--line2);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:13.5px;font-family:inherit;cursor:pointer;text-align:left}
.sel-btn:hover{border-color:var(--acc)}
.sel-btn.open{border-color:var(--acc);box-shadow:0 0 0 3px rgba(45,212,191,.12)}
.sel-btn .sel-ph{color:var(--faint)}
.sel-ch{flex-shrink:0;color:var(--muted);transition:transform .2s}
.sel-btn.open .sel-ch{transform:rotate(180deg)}
.sel-pop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;right:0;background:#0d1420;border:1px solid var(--line2);border-radius:11px;box-shadow:0 18px 44px rgba(0,0,0,.5);overflow:hidden}
.sel-search{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--muted)}
.sel-search input{flex:1;background:transparent;border:none;outline:none;color:var(--txt);font-size:13px;font-family:inherit}
.sel-list{max-height:300px;overflow-y:auto;padding:5px}
.sel-opt{width:100%;display:flex;align-items:center;gap:9px;background:transparent;border:none;border-radius:8px;padding:9px 11px;color:var(--txt);font-size:12.8px;cursor:pointer;font-family:inherit;text-align:left}
.sel-opt:hover{background:rgba(45,212,191,.09)}
.sel-opt.on{background:rgba(45,212,191,.16)}
.sel-code{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--acc);font-weight:600;flex-shrink:0;min-width:64px}
.sel-name{flex:1}
.sel-nace{font-size:10.5px;color:var(--faint);flex-shrink:0}
.card-pop{position:relative;z-index:60}
.card:has(.sel-pop){position:relative;z-index:60}
@media (max-width:900px){.kpi-row{grid-template-columns:repeat(3,1fr)}.risk-eval{grid-template-columns:1fr 1fr}.fg3{grid-template-columns:1fr 1fr}.fg2-cards{grid-template-columns:1fr}.plan-ro{grid-template-columns:1fr}.an-grid{grid-template-columns:1fr}.an-kpi{grid-template-columns:repeat(3,1fr)}.bar-row{grid-template-columns:90px 1fr 40px}}
@media (max-width:560px){.kpi-row{grid-template-columns:repeat(2,1fr)}.fg3{grid-template-columns:1fr}.att-row{grid-template-columns:1fr 1fr}.an-kpi{grid-template-columns:repeat(2,1fr)}}

@media print{
  .ai-root{background:#fff!important;color:#111!important;min-height:0}
  .ai-rail,.ai-top,.head,.rep-bar .btn,.rep-bar .head,.no-print{display:none!important}
  .ai-content{padding:0;overflow:visible}.wrap{max-width:100%}
  .report{border:none;background:#fff;color:#111;padding:0;backdrop-filter:none}
  .report *{color:#111!important}.rep-head p.mono{color:#555!important}
  .rep-badge{border-color:#111!important;background:#fff!important}
  .rep-ctrl{border-color:#ccc!important}.rep-ctrl>div{border-color:#ccc!important}
  .rep-block h3 em{background:#111;color:#fff}

  );
}


class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("AuditISO · PRO — error capturado:", error, info); }
  render() {
    if (this.state.error) {
      return React.createElement('div', {
        style: { minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 14, background: '#070b14', color: '#e6ecf5', fontFamily: 'system-ui,sans-serif', padding: 24, textAlign: 'center' }
      },
        React.createElement('div', { style: { fontSize: 18, fontWeight: 600 } }, 'Ocurrió un error inesperado'),
        React.createElement('div', { style: { fontSize: 13, color: '#93a1b8', maxWidth: 420 } }, 'La aplicación encontró un problema y no puede continuar. Tus datos guardados no se han perdido (autoguardado local). Intenta recargar la página.'),
        React.createElement('button', {
          onClick: () => window.location.reload(),
          style: { marginTop: 8, padding: '10px 18px', borderRadius: 8, border: '1px solid rgba(45,212,191,.4)', background: 'rgba(45,212,191,.12)', color: '#2dd4bf', fontWeight: 600, cursor: 'pointer' }
        }, 'Recargar aplicación')
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ErrorBoundary, null, React.createElement(App)));
