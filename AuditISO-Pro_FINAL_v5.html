      { id: "4.3", ref: "4.3", text: "¿El alcance del SGC está determinado, documentado y disponible, justificando exclusiones?", ev: "Documento de alcance y justificación" },
      { id: "4.4", ref: "4.4", text: "¿Se establecen los procesos, entradas/salidas, secuencia, interacción, criterios, indicadores y responsables?", ev: "Mapa de procesos, fichas de proceso, KPI" }]},
    { id: "5", title: "Liderazgo", items: [
      { id: "5.1.1", ref: "5.1.1", text: "¿La alta dirección demuestra liderazgo: rendición de cuentas, integración del SGC en el negocio y recursos?", ev: "Entrevistas a dirección, presupuestos" },
      { id: "5.1.2", ref: "5.1.2", text: "¿Se asegura el enfoque al cliente: requisitos, riesgos/oportunidades y satisfacción?", ev: "Encuestas, análisis de quejas, indicadores" },
      { id: "5.2", ref: "5.2", text: "¿La política de calidad es apropiada, comunicada, entendida y documentada?", ev: "Política publicada, evidencia de comunicación" },
      { id: "5.3", ref: "5.3", text: "¿Roles, responsabilidades y autoridades asignados y comunicados?", ev: "Organigrama, matriz RACI" }]},
    { id: "6", title: "Planificación", items: [
      { id: "6.1", ref: "6.1", text: "¿Se determinan y abordan riesgos y oportunidades y se evalúa la eficacia de las acciones?", ev: "Matriz de riesgos, planes de acción" },
      { id: "6.2", ref: "6.2", text: "¿Los objetivos de calidad son medibles, coherentes y planificados (qué, recursos, responsable, plazo)?", ev: "Objetivos SMART, seguimiento de KPI" },
      { id: "6.3", ref: "6.3", text: "¿Los cambios en el SGC se planifican de manera controlada?", ev: "Registros de gestión del cambio" }]},
    { id: "7", title: "Apoyo", items: [
      { id: "7.1", ref: "7.1", text: "¿Se proveen recursos: personas, infraestructura, ambiente, seguimiento y medición (trazabilidad) y conocimientos?", ev: "Mantenimiento, calibraciones, gestión del conocimiento" },
      { id: "7.2", ref: "7.2", text: "¿Se determina la competencia y se conserva evidencia (educación, formación, experiencia)?", ev: "Matriz de competencias, registros de formación" },
      { id: "7.3", ref: "7.3", text: "¿El personal toma conciencia de política, objetivos y su contribución?", ev: "Registros de sensibilización, entrevistas" },
      { id: "7.4", ref: "7.4", text: "¿Se determina la comunicación interna y externa (qué, cuándo, a quién, cómo, quién)?", ev: "Plan de comunicación" },
      { id: "7.5", ref: "7.5", text: "¿La información documentada se controla (identificación, aprobación, distribución, cambios, retención)?", ev: "Listado maestro, control de versiones" }]},
    { id: "8", title: "Operación", items: [
      { id: "8.1", ref: "8.1", text: "¿Se planifica y controla la operación con criterios de proceso y aceptación?", ev: "Planes de calidad, criterios de aceptación" },
      { id: "8.2", ref: "8.2", text: "¿Se determinan y revisan los requisitos antes de comprometerse con el cliente?", ev: "Revisión de contratos/pedidos" },
      { id: "8.3", ref: "8.3", text: "¿El diseño y desarrollo se controla (entradas, controles, salidas, cambios)? (si aplica)", ev: "Registros de diseño, verificación y validación" },
      { id: "8.4", ref: "8.4", text: "¿Se controlan los suministros externos y se evalúan proveedores?", ev: "Evaluación de proveedores, inspección de entrada" },
      { id: "8.5", ref: "8.5", text: "¿Producción bajo condiciones controladas: identificación, trazabilidad, propiedad del cliente, preservación?", ev: "Órdenes de trabajo, trazabilidad" },
      { id: "8.6", ref: "8.6", text: "¿Se verifica el cumplimiento antes de la liberación con trazabilidad a quien autoriza?", ev: "Registros de liberación, firmas" },
      { id: "8.7", ref: "8.7", text: "¿Se controlan las salidas no conformes (identificación, tratamiento, concesión)?", ev: "Registro de producto no conforme" }]},
    { id: "9", title: "Evaluación del desempeño", items: [
      { id: "9.1", ref: "9.1", text: "¿Se determina qué/cómo/cuándo medir, incluida satisfacción, y se analizan los datos?", ev: "Indicadores, análisis de datos, satisfacción" },
      { id: "9.2", ref: "9.2", text: "¿El programa de auditoría interna es adecuado, con auditores objetivos e imparciales?", ev: "Programa y plan, informes, competencia de auditores" },
      { id: "9.3", ref: "9.3", text: "¿La revisión por la dirección cubre todas las entradas y genera salidas?", ev: "Acta de revisión por la dirección" }]},
    { id: "10", title: "Mejora", items: [
      { id: "10.1", ref: "10.1", text: "¿Se determinan y seleccionan oportunidades de mejora?", ev: "Proyectos de mejora" },
      { id: "10.2", ref: "10.2", text: "¿Ante una NC se reacciona, se evalúa causa raíz y se verifica eficacia?", ev: "Acciones correctivas, verificación de eficacia" },
      { id: "10.3", ref: "10.3", text: "¿Se mejora continuamente la conveniencia, adecuación y eficacia del SGC?", ev: "Tendencias de KPI" }]},
  ]},

const normTxt = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function recommendIAF(scope) {
  const t = normTxt(scope);
  if (t.trim().length < 3) return [];
  const stem = (w) => w.replace(/(es|s)$/, "");
  const tokens = t.split(/[^a-z0-9]+/).filter(Boolean);
  const tokSet = new Set(tokens);
  const stemSet = new Set(tokens.map(stem));
  const hit = (kw) => { const k = normTxt(kw); if (k.includes(" ")) return t.includes(k); return tokSet.has(k) || stemSet.has(k) || stemSet.has(stem(k)) || tokSet.has(stem(k)); };
  let scored = IAF_CODES.map((x) => ({ ...x, score: x.kw.reduce((n, k) => (hit(k) ? n + 1 : n), 0) }))
    .filter((x) => x.score > 0).sort((a, b) => b.score - a.score);
  // Los sectores de comercio/servicios genéricos solo se sugieren si el negocio es principalmente
  // comercial/de servicios; si hay un sector específico de producto o industria, se ocultan.
  const GENERIC = new Set(["29", "31", "32", "35"]);
  const STRONG = ["comercio", "comercializadora", "distribuidora", "distribuidor", "retail", "tienda", "supermercado", "mayorista", "minorista", "importadora", "exportadora", "boutique"];
  const commercePrimary = STRONG.some((k) => hit(k));
  const hasSpecific = scored.some((x) => !GENERIC.has(x.c));
  if (hasSpecific && !commercePrimary) scored = scored.filter((x) => !GENERIC.has(x.c));
  return scored.slice(0, 3);
}

/* --- Motor de análisis por reglas (heurístico, no IA generativa) --- */
function analyzeSystem({ audit, findings, risks, documents, people, annual, execution, metrics }) {
  audit = audit || {}; execution = execution || emptyExecution();
  const out = [];
  const today = todayStr();
  const overdueActions = findings.filter((f) => (f.type === "ncm" || f.type === "ncmenor") && f.action?.status !== "Cerrada" && f.action?.due && f.action.due < today);
  if (overdueActions.length) out.push({ level: "alto", text: `${overdueActions.length} acción(es) correctiva(s) vencida(s) sin cerrar. Riesgo de reincidencia y hallazgo en auditoría externa.` });
  if (metrics.byType.ncm > 0) out.push({ level: "alto", text: `Existen ${metrics.byType.ncm} NC mayor(es) abiertas. Bloquean la recomendación de certificación hasta verificar eficacia.` });
  const clausesWithNC = {};
  findings.forEach((f) => { if (f.type === "ncm" || f.type === "ncmenor") { const k = (f.clause || "").split(".")[0]; if (k) clausesWithNC[k] = (clausesWithNC[k] || 0) + 1; } });
  const hot = Object.entries(clausesWithNC).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]);
  if (hot.length) out.push({ level: "medio", text: `Concentración de hallazgos en la cláusula ${hot[0][0]} (${hot[0][1]} NC). Sugiere debilidad sistémica, no puntual.` });
  const criticalRisks = risks.filter((r) => r.kind === "Riesgo" && r.prob * r.impact >= 15 && r.status !== "Cerrado" && r.status !== "Controlado");
  if (criticalRisks.length) out.push({ level: "alto", text: `${criticalRisks.length} riesgo(s) de nivel crítico sin controlar. Priorizar planes de mitigación.` });
  const docsReview = documents.filter((d) => d.status === "aprobado" && d.nextReview && d.nextReview < today);
  if (docsReview.length) out.push({ level: "medio", text: `${docsReview.length} documento(s) aprobado(s) con revisión vencida. Posible NC en 7.5 (información documentada).` });
  const draft = documents.filter((d) => d.status !== "aprobado" && d.status !== "obsoleto");
  if (draft.length) out.push({ level: "bajo", text: `${draft.length} documento(s) sin aprobar (borrador/revisión).` });
  const gapPeople = people.filter((p) => (p.evals || []).some((e) => e.result === "No competente" || e.result === "Competente con brecha"));
  if (gapPeople.length) out.push({ level: "medio", text: `${gapPeople.length} persona(s) con brecha de competencia registrada. Verificar plan de formación (cláusula 7.2).` });
  const expiringCerts = [];
  people.forEach((p) => (p.certs || []).forEach((c) => { if (c.expiry && daysBetween(c.expiry, today) <= 60) expiringCerts.push(c); }));
  if (expiringCerts.length) out.push({ level: "medio", text: `${expiringCerts.length} certificación(es) del personal vence(n) en ≤60 días.` });
  const noAuditor = people.filter((p) => p.isAuditor).length === 0;
  if (noAuditor && annual.length) out.push({ level: "bajo", text: "Hay auditorías programadas pero ningún auditor calificado registrado en Competencias." });
  if (metrics.total > 0 && metrics.pct < 100) out.push({ level: metrics.pct < 60 ? "medio" : "bajo", text: `Cobertura de verificación al ${metrics.pct}% — ${metrics.pending} requisito(s) sin evaluar. No emitas conclusiones hasta cubrir el 100% o justificar los N/A.` });
  // --- Proceso de auditoría (ISO 19011) ---
  if (!audit.leadAuditor) out.push({ level: "medio", text: "No se ha designado auditor líder. ISO 19011 exige un líder del equipo responsable de la auditoría." });
  if (!audit.criteria) out.push({ level: "medio", text: "No se han definido los criterios de auditoría (normas, política, procedimientos, requisitos legales)." });
  if (!audit.objectives) out.push({ level: "bajo", text: "No se han definido los objetivos de la auditoría." });
  if (metrics.naNoJust > 0) out.push({ level: "medio", text: `${metrics.naNoJust} requisito(s) marcados como "No aplica" sin justificación. Todo N/A debe justificarse por escrito.` });
  if (!metrics.openingDone) out.push({ level: "medio", text: "No hay registro de reunión de apertura con lista de asistencia (ISO 19011 §6.4.3)." });
  if (findings.length > 0 && !metrics.closingDone) out.push({ level: "medio", text: "Se registraron hallazgos pero no hay reunión de cierre documentada (ISO 19011 §6.4.10)." });
  if (metrics.phasesPending > 0) out.push({ level: metrics.phasesPending > 4 ? "medio" : "bajo", text: `${metrics.phasesPending} fase(s) del proceso de auditoría sin completar. Revisa el módulo Ejecución antes de cerrar.` });
  if (findings.some((f) => f.type === "ncm" || f.type === "ncmenor") && (execution.evidence || []).length === 0) out.push({ level: "bajo", text: "Hay no conformidades pero el registro de evidencias/muestreo está vacío. Documenta la muestra que sustenta cada hallazgo." });
  const ncNoRoot = findings.filter((f) => (f.type === "ncm" || f.type === "ncmenor") && !((f.rootCause?.whys || []).some(Boolean) || Object.values(f.rootCause?.ishikawa || {}).some(Boolean)));
  if (ncNoRoot.length) out.push({ level: "medio", text: `${ncNoRoot.length} no conformidad(es) sin análisis de causa raíz registrado.` });
  const ncNoAccept = findings.filter((f) => (f.type === "ncm" || f.type === "ncmenor") && !f.acceptedBy);
  if (ncNoAccept.length) out.push({ level: "bajo", text: `${ncNoAccept.length} no conformidad(es) sin acuse/aceptación del auditado.` });
  if (!out.length) out.push({ level: "ok", text: "Sin alertas relevantes. El proceso y el sistema no presentan desviaciones automáticas detectables con los datos actuales." });
  return out;
}

const AI_STORE = "auditiso_ai_v1";
const AI_PROVIDERS = {
  gemini:     { name: "Google Gemini",        tier: "gratis", note: "Nivel gratuito generoso.", kind: "gemini",    keyUrl: "https://aistudio.google.com/apikey",        models: ["gemini-2.0-flash", "gemini-2.0-flash-lite", "gemini-1.5-flash", "gemini-1.5-pro"] },
  groq:       { name: "Groq",                  tier: "gratis", note: "Muy rápido. Llama y otros modelos abiertos.", kind: "openai", base: "https://api.groq.com/openai/v1", keyUrl: "https://console.groq.com/keys", models: ["llama-3.3-70b-versatile", "llama-3.1-8b-instant", "gemma2-9b-it"] },
  openrouter: { name: "OpenRouter",            tier: "gratis", note: "Acceso a muchos modelos; incluye variantes gratuitas (:free).", kind: "openai", base: "https://openrouter.ai/api/v1", keyUrl: "https://openrouter.ai/keys", models: ["meta-llama/llama-3.3-70b-instruct:free", "google/gemini-2.0-flash-exp:free", "deepseek/deepseek-chat-v3-0324:free", "mistralai/mistral-small-3.2-24b-instruct:free"] },
  mistral:    { name: "Mistral AI",            tier: "gratis", note: "Nivel gratuito con registro.", kind: "openai", base: "https://api.mistral.ai/v1", keyUrl: "https://console.mistral.ai/api-keys", models: ["mistral-small-latest", "open-mistral-nemo", "mistral-large-latest"] },
  openai:     { name: "OpenAI",                tier: "de pago", note: "Requiere saldo. Clave sk-…", kind: "openai", base: "https://api.openai.com/v1", keyUrl: "https://platform.openai.com/api-keys", models: ["gpt-4o-mini", "gpt-4o", "gpt-4.1-mini"] },
  anthropic:  { name: "Anthropic (Claude)",    tier: "de pago", note: "Requiere saldo. Clave sk-ant-…", kind: "anthropic", base: "https://api.anthropic.com/v1", keyUrl: "https://console.anthropic.com/settings/keys", models: ["claude-3-5-haiku-latest", "claude-3-5-sonnet-latest"] },
};
async function callAI(providerId, apiKey, model, system, history) {
  const p = AI_PROVIDERS[providerId];
  if (!p) throw new Error("Proveedor no válido");
  if (!apiKey) throw new Error("Falta la API key");
  if (p.kind === "gemini") {
    const contents = history.map((m) => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] }));
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ system_instruction: { parts: [{ text: system }] }, contents, generationConfig: { temperature: 0.3, maxOutputTokens: 1400 } }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || `Error ${res.status}`);
    return (data.candidates?.[0]?.content?.parts || []).map((x) => x.text).join("") || "(respuesta vacía)";
  }
  if (p.kind === "anthropic") {
    const res = await fetch(p.base + "/messages", {
      method: "POST", headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model, max_tokens: 1400, system, messages: history.map((m) => ({ role: m.role, content: m.content })) }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || `Error ${res.status}`);
    return (data.content || []).map((x) => x.text).filter(Boolean).join("") || "(respuesta vacía)";
  }
  // OpenAI-compatible (Groq, OpenRouter, Mistral, OpenAI)
  const res = await fetch(p.base + "/chat/completions", {
    method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
    body: JSON.stringify({ model, temperature: 0.3, max_tokens: 1400, messages: [{ role: "system", content: system }, ...history.map((m) => ({ role: m.role, content: m.content }))] }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || data.error || `Error ${res.status}`);
  return data.choices?.[0]?.message?.content || "(respuesta vacía)";
}
function buildAuditContext(audit, standards, metrics, findings) {
  const normas = (standards || []).map((s) => STANDARDS[s]?.name || s).join(", ") || "no definidas";
  const tipos = { ncm: 0, ncmenor: 0, obs: 0, om: 0 };
  (findings || []).forEach((f) => { if (tipos[f.type] != null) tipos[f.type]++; });
  return [
    `Organización auditada: ${audit.org || "sin especificar"}.`,
    `Tipo: ${audit.party || audit.type || "—"}. Etapa: ${audit.stage || "—"}.`,
    `Normas/criterios: ${normas}.`,
    `Alcance: ${audit.scope || "—"}.`,
    `Objetivos: ${audit.objectives || "—"}.`,
    `Auditor líder: ${audit.leadAuditor || "—"}.`,
    `Verificación: ${metrics?.done || 0}/${metrics?.total || 0} requisitos (${metrics?.pct || 0}%).`,
    `Hallazgos: ${tipos.ncm} NC mayores, ${tipos.ncmenor} NC menores, ${tipos.obs} observaciones, ${tipos.om} oportunidades de mejora.`,
  ].join("\n");
}
function AsistenteIA({ audit, findings, metrics, standards }) {
  const [cfg, setCfg] = useState({ provider: "gemini", model: AI_PROVIDERS.gemini.models[0], keys: {} });

    setReady(true);
  })(); }, []);
  useEffect(() => { if (ready) window.storage.set(AI_STORE, JSON.stringify(cfg)).catch(() => {}); }, [cfg, ready]);

  ];

  const send = async (text) => {

    try {
      const reply = await callAI(cfg.provider, key, cfg.model, system, history);
      setMessages((m) => [...m, { role: "assistant", content: reply }]);
    } catch (e) {
      setMessages((m) => [...m, { role: "assistant", content: `⚠ No se pudo obtener respuesta: ${e.message}\n\nRevisa la API key, el modelo seleccionado o tu conexión. Algunos proveedores pueden bloquear llamadas desde el navegador (CORS); en ese caso prueba con Gemini, Groq u OpenRouter.` }]);

  return (

          </F>

      <div className="ai-chat">

            </div>
          )}
          {messages.map((m, i) => (
            <div key={i} className={`ai-msg ${m.role}`}>
              <span className="ai-av">{m.role === "assistant" ? <Bot size={15} /> : "Tú"}</span>

            </div>
          ))}
          {busy && <div className="ai-msg assistant"><span className="ai-av"><Bot size={15} /></span><div className="ai-bubble ai-typing"><span /><span /><span /></div></div>}
        </div>
        {err && <p className="ai-err">{err}</p>}
        <div className="ai-input">
          <textarea className="inp" rows={2} value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }} placeholder="Escribe tu pregunta… (Enter para enviar, Shift+Enter para salto de línea)" />

      <p className="hint">La IA es un apoyo orientativo; el juicio profesional y la evidencia objetiva del auditor prevalecen. Verifica siempre las referencias normativas.</p>
    </div>
  );
}

            if (s.approvals) setApprovals(s.approvals);
            if (s.currentUser) setCurrentUser(s.currentUser);
            if (s.audit?.standards?.[0]) setViewStd(s.audit.standards[0]);
            if (s.lastSaved) setLastSaved(s.lastSaved);
          }
        }
      } catch {} finally { if (alive) setLoading(false); }
    })();
    return () => { alive = false; };
  }, []);

  useEffect(() => {
    if (loading) return;
    if (firstLoad.current) { firstLoad.current = false; return; }
    setSaveState("saving");
    const t = setTimeout(async () => {
      const ts = new Date().toISOString();
      try {
        if (typeof window !== "undefined" && window.storage)
          await window.storage.set(STORAGE_KEY, JSON.stringify({ audit, plan, checklist, findings, annual, risks, documents, people, execution, trail, approvals, currentUser, lastSaved: ts }));
        setLastSaved(ts); setSaveState("saved");
        setTimeout(() => setSaveState("idle"), 1600);
      } catch { setSaveState("idle"); }
    }, 700);
    return () => clearTimeout(t);
  }, [audit, plan, checklist, findings, annual, risks, documents, people, execution, trail, approvals, currentUser, loading]);

  const auditedStandards = audit.standards.length ? audit.standards : ["iso9001"];
  useEffect(() => { if (!auditedStandards.includes(viewStd)) setViewStd(auditedStandards[0]); }, [audit.standards]); // eslint-disable-line

  const metrics = useMemo(() => {
    const byType = { ncm: 0, ncmenor: 0, obs: 0, om: 0, conf: 0 };
    findings.forEach((f) => { byType[f.type] = (byType[f.type] || 0) + 1; });
    let total = 0, done = 0, naNoJust = 0;
    const byStatus = { C: 0, NC: 0, OBS: 0, NA: 0 };
    const perStd = {};
    auditedStandards.forEach((std) => {
      let st = 0, sd = 0;
      STANDARDS[std].clauses.forEach((c) => c.items.forEach((it) => {
        total++; st++;
        const cell = checklist[`${std}|${it.id}`];
        if (cell?.status) { done++; sd++; byStatus[cell.status] = (byStatus[cell.status] || 0) + 1; if (cell.status === "NA" && !(cell.note || "").trim()) naNoJust++; }
      }));
      perStd[std] = { total: st, done: sd };
    });
    const pending = total - done;
    const open = findings.filter((f) => (f.type === "ncm" || f.type === "ncmenor") && f.action?.status !== "Cerrada").length;
    const today = todayStr();
    const overdue = findings.filter((f) => (f.type === "ncm" || f.type === "ncmenor") && f.action?.status !== "Cerrada" && f.action?.due && f.action.due < today).length;
    const criticalRisks = risks.filter((r) => r.kind === "Riesgo" && r.prob * r.impact >= 15 && r.status !== "Cerrado" && r.status !== "Controlado").length;
    const docsPending = documents.filter((d) => d.status !== "aprobado" && d.status !== "obsoleto").length;
    const docsReview = documents.filter((d) => d.status === "aprobado" && d.nextReview && d.nextReview < today).length;
    const auditorsQ = people.filter((p) => p.isAuditor).length;
    const compGaps = people.filter((p) => (p.evals || []).some((e) => e.result !== "Competente")).length;
    const annualDone = annual.filter((a) => a.status === "realizada" || a.status === "cerrada").length;
    // Tendencia: hallazgos por mes (últimos 6 meses) con createdAt
    const trend = {};
    findings.forEach((f) => { const d = f.createdAt ? new Date(f.createdAt) : null; if (d) { const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; trend[k] = (trend[k] || 0) + 1; } });
    // Fases del proceso (ISO 19011)
    const ph = execution?.phases || {};
    const phasesDone = ISO19011_PHASES.filter((p) => ph[p.id] === "hecho").length;
    const phasesNa = ISO19011_PHASES.filter((p) => ph[p.id] === "na").length;
    const phasesTotal = ISO19011_PHASES.length;
    const phasesPending = phasesTotal - phasesDone - phasesNa;
    const readiness = phasesTotal ? Math.round(((phasesDone + phasesNa) / phasesTotal) * 100) : 0;
    const openingDone = !!(execution?.opening?.date && (execution.opening.attendees || []).some((a) => a.name));
    const closingDone = !!(execution?.closing?.date && (execution.closing.attendees || []).some((a) => a.name));
    return { byType, total, done, pending, byStatus, perStd, naNoJust, pct: total ? Math.round((done / total) * 100) : 0, open, overdue, criticalRisks, docsPending, docsReview, auditorsQ, compGaps, annualDone, annualTotal: annual.length, trend, phasesDone, phasesNa, phasesTotal, phasesPending, readiness, openingDone, closingDone };
  }, [findings, checklist, audit.standards, risks, documents, people, annual, execution]);

  const alerts = useMemo(() => analyzeSystem({ audit, findings, risks, documents, people, annual, execution, metrics }), [audit, findings, risks, documents, people, annual, execution, metrics]);

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify({ audit, plan, checklist, findings, annual, risks, documents, people, execution, trail, approvals }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = url; a.download = `AuditISO_${slug(audit.org || "sin_nombre")}.json`; a.click(); URL.revokeObjectURL(url);
  };
  const importJSON = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    if (!confirm("Importar reemplazará todos los datos de la auditoría actual (organización, programa, checklist y hallazgos). ¿Continuar?")) { e.target.value = ""; return; }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const s = JSON.parse(reader.result);
        if (!s || typeof s !== "object") throw new Error("formato inválido");
        setAudit({ ...emptyAudit, ...(s.audit || {}) });
        setPlan(migratePlan(s.plan));
        setChecklist(s.checklist && typeof s.checklist === "object" ? s.checklist : {});
        setFindings(Array.isArray(s.findings) ? s.findings : []);
        setAnnual(Array.isArray(s.annual) ? s.annual : []);
        setRisks(Array.isArray(s.risks) ? s.risks : []);
        setDocuments(Array.isArray(s.documents) ? s.documents : []);
        setPeople(Array.isArray(s.people) ? s.people : []);
        setExecution(s.execution && typeof s.execution === "object" ? { ...emptyExecution(), ...s.execution } : emptyExecution());
        setTrail(Array.isArray(s.trail) ? s.trail : []);
        if (s.approvals) setApprovals(s.approvals);
        log("Importación de datos", "Se reemplazó la auditoría actual desde archivo JSON");
      } catch { alert("Archivo no válido. Verifica que sea un JSON exportado desde AuditISO · PRO."); }
    };
    reader.onerror = () => alert("No se pudo leer el archivo.");
    reader.readAsText(file); e.target.value = "";
  };
  const resetAll = () => { if (!confirm("¿Iniciar una nueva auditoría? Se borrarán los datos actuales (organización, programa, verificación, hallazgos, riesgos, documentos, competencias y trazabilidad).")) return; setAudit(emptyAudit); setPlan([]); setChecklist({}); setFindings([]); setAnnual([]); setRisks([]); setDocuments([]); setPeople([]); setExecution(emptyExecution()); setTrail([]); setApprovals({ preparedBy: "", reviewedBy: "", approvedBy: "", status: "Borrador", sign: "" }); setTab("config"); };

  /* Guardado manual inmediato (no espera al autoguardado) */
  const saveNow = async () => {
    const ts = new Date().toISOString();
    setSaveState("saving");
    try {
      if (typeof window !== "undefined" && window.storage)
        await window.storage.set(STORAGE_KEY, JSON.stringify({ audit, plan, checklist, findings, annual, risks, documents, people, execution, trail, approvals, currentUser, lastSaved: ts }));
      setLastSaved(ts); setSaveState("saved");
      setTimeout(() => setSaveState("idle"), 1600);
    } catch { setSaveState("idle"); alert("No se pudo guardar. Revisa el almacenamiento del navegador."); }
  };

  /* Borrado total: limpia TODO, destilda todas las normas y elimina lo grabado */
  const clearAll = async () => {
    if (!confirm("⚠ BORRAR TODO\n\nSe eliminará por completo toda la información cargada (organización, alcance, normas seleccionadas, programa, verificación, hallazgos, riesgos, documentos, competencias, aprobaciones y trazabilidad) y quedará todo en blanco y 100% editable.\n\nEsta acción no se puede deshacer. ¿Continuar?")) return;
    setAudit({ ...emptyAudit, standards: [] });
    setPlan([]); setChecklist({}); setFindings([]); setAnnual([]); setRisks([]); setDocuments([]); setPeople([]);
    setExecution(emptyExecution()); setTrail([]);
    setApprovals({ preparedBy: "", reviewedBy: "", approvedBy: "", status: "Borrador", sign: "" });
    setLastSaved(null);
    try { if (typeof window !== "undefined" && window.storage) await window.storage.delete(STORAGE_KEY); } catch {}
    setSaveState("idle");
    setTab("config");
  };

  const NAV = [
    { id: "panel", label: "Panel", icon: LayoutDashboard },
    { id: "config", label: "Configuración", icon: Settings },
    { id: "anual", label: "Programa anual", icon: CalendarDays },
    { id: "ejec", label: "Ejecución", icon: FileCheck },
    { id: "plan", label: "Plan y agenda", icon: ClipboardCheck },
    { id: "checklist", label: "Verificación", icon: ListChecks },
    { id: "hallazgos", label: "Hallazgos", icon: AlertTriangle },
    { id: "riesgos", label: "Riesgos", icon: Radar },
    { id: "docs", label: "Documentos", icon: Folder },
    { id: "compet", label: "Competencias", icon: Award },
    { id: "traza", label: "Trazabilidad", icon: History },
    { id: "analisis", label: "Análisis", icon: BarChart3 },
    { id: "informe", label: "Informe", icon: FileText },
    { id: "ia", label: "Asistente IA", icon: Sparkles },
  ];

  return (
    <div className="ai-root">
      <Styles />
      {loading ? (
        <div className="ai-boot">
          <div className="ai-boot-mark"><Radar className="spin-slow" size={30} /></div>
          <div className="ai-boot-txt">Inicializando centro de mando…</div>
          <div className="ai-boot-cred">AuditISO · PRO — Fernando Silva</div>
        </div>
      ) : (
        <div className="ai-shell">
          {/* RAIL */}
          <aside className="ai-rail">
            <div className="ai-brand">
              <div className="ai-brand-mark"><Radar size={20} /></div>
              <div>
                <div className="ai-brand-name">AuditISO<span className="ai-pro">PRO</span></div>
                <div className="ai-brand-sub">Centro de mando</div>
              </div>
            </div>
            <nav className="ai-nav">
              {NAV.map((n) => {
                const Icon = n.icon; const active = tab === n.id;
                return (
                  <button key={n.id} onClick={() => setTab(n.id)} className={`ai-nav-btn${active ? " active" : ""}`}>
                    <Icon size={17} /><span>{n.label}</span>
                    {n.id === "hallazgos" && findings.length > 0 && <em className="ai-badge">{findings.length}</em>}
                  </button>
                );
              })}
            </nav>
            <div className="ai-rail-foot">
              <button onClick={exportJSON} className="ai-mini"><Download size={13} /> Exportar</button>
              <label className="ai-mini"><Upload size={13} /> Importar<input type="file" accept="application/json" onChange={importJSON} hidden /></label>
              <button onClick={resetAll} className="ai-mini danger"><RotateCcw size={13} /> Nueva</button>
              <div className="ai-cred">Desarrollado por<br /><b>Fernando Silva</b></div>
            </div>
          </aside>

          {/* MAIN */}
          <main className="ai-main">
            <header className="ai-top">
              <select className="ai-mobilenav" value={tab} onChange={(e) => setTab(e.target.value)}>
                {NAV.map((n) => <option key={n.id} value={n.id}>{n.label}</option>)}
              </select>
              <div className="ai-top-title">
                <div className="ai-org">{audit.org || "Auditoría sin asignar"}</div>
                <div className="ai-meta">
                  <span className="mono">{auditedStandards.map((s) => STANDARDS[s].name).join(" · ")}</span>
                  <i>·</i><span>{audit.type}</span>{audit.stage && <><i>·</i><span>{audit.stage}</span></>}
                </div>
              </div>
              <div className="ai-top-right">
                <LiveClock />
                <div className="ai-top-div" />
                <div className="ai-status">
                  <span className="ai-live"><CircleDot size={11} className="pulse" /> SISTEMA OPERATIVO</span>
                  <span className="ai-save">
                    {saveState === "saving" && <><Loader2 size={12} className="spin" /> guardando…</>}
                    {saveState === "saved" && <span className="ok">✓ sincronizado</span>}
                    {saveState === "idle" && lastSaved && <span className="faint mono">{new Date(lastSaved).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" })}</span>}
                  </span>
                </div>
              </div>
            </header>

            <div className="ai-content">
              {tab === "panel" && <Panel audit={audit} metrics={metrics} findings={findings} setTab={setTab} standards={auditedStandards} alerts={alerts} />}
              {tab === "config" && <Config audit={audit} setAudit={setAudit} currentUser={currentUser} setCurrentUser={setCurrentUser} saveNow={saveNow} clearAll={clearAll} saveState={saveState} lastSaved={lastSaved} />}
              {tab === "anual" && <ProgramaAnual annual={annual} setAnnual={setAnnual} log={log} />}
              {tab === "ejec" && <Ejecucion audit={audit} execution={execution} setExecution={setExecution} metrics={metrics} standards={auditedStandards} setTab={setTab} log={log} />}
              {tab === "plan" && <PlanTab plan={plan} setPlan={setPlan} audit={audit} execution={execution} log={log} />}
              {tab === "checklist" && <Checklist standards={auditedStandards} viewStd={viewStd} setViewStd={setViewStd} checklist={checklist} setChecklist={setChecklist} setFindings={setFindings} setTab={setTab} log={log} />}
              {tab === "hallazgos" && <Hallazgos findings={findings} setFindings={setFindings} standards={auditedStandards} audit={audit} log={log} />}
              {tab === "riesgos" && <Riesgos risks={risks} setRisks={setRisks} log={log} />}
              {tab === "docs" && <Documentos documents={documents} setDocuments={setDocuments} currentUser={currentUser} log={log} />}
              {tab === "compet" && <Competencias people={people} setPeople={setPeople} log={log} />}
              {tab === "traza" && <Trazabilidad trail={trail} setTrail={setTrail} currentUser={currentUser} />}
              {tab === "analisis" && <Analisis findings={findings} metrics={metrics} standards={auditedStandards} setTab={setTab} />}
              {tab === "ia" && <AsistenteIA audit={audit} findings={findings} metrics={metrics} standards={auditedStandards} />}
              {tab === "informe" && <Informe audit={audit} plan={plan} findings={findings} metrics={metrics} standards={auditedStandards} risks={risks} documents={documents} people={people} annual={annual} execution={execution} approvals={approvals} setApprovals={setApprovals} alerts={alerts} log={log} />}
            </div>
          </main>
        </div>
      )}
    </div>
  );
}

function LiveClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  const h = String(now.getHours()).padStart(2, "0");
  const m = String(now.getMinutes()).padStart(2, "0");
  const s = String(now.getSeconds()).padStart(2, "0");
  const rawDate = now.toLocaleDateString("es-ES", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
  const date = rawDate.charAt(0).toUpperCase() + rawDate.slice(1);
  return (
    <div className="ai-clock">
      <div className="ai-clock-time mono">
        <span>{h}</span>
        <span className={`ai-clock-colon${now.getSeconds() % 2 ? " dim" : ""}`}>:</span>
        <span>{m}</span>
        <span className="ai-clock-sec mono">:{s}</span>
      </div>
      <div className="ai-clock-date">{date}</div>
    </div>
  );
}

function Panel({ audit, metrics, findings, setTab, standards, alerts }) {

  const alertLevel = { alto: { c: "#f87171", bg: "rgba(248,113,113,.12)", ring: "rgba(248,113,113,.35)" }, medio: { c: "#fbbf24", bg: "rgba(251,191,36,.12)", ring: "rgba(251,191,36,.35)" }, bajo: { c: "#60a5fa", bg: "rgba(96,165,250,.12)", ring: "rgba(96,165,250,.3)" }, ok: { c: "#34d399", bg: "rgba(52,211,153,.12)", ring: "rgba(52,211,153,.3)" } };
  return (
    <div className="wrap">
      <Head icon={Activity} title="Panel de control" sub="Estado en tiempo real de la auditoría y del sistema de gestión" />

      <div className="grid-3">
        <Gauge label="Avance de verificación" value={metrics.pct} suffix="%" sub={`${metrics.done} / ${metrics.total} requisitos`} onClick={() => setTab("checklist")} />
        <Stat icon={AlertTriangle} tone="#f87171" label="NC abiertas" value={metrics.open} sub={metrics.overdue > 0 ? `${metrics.overdue} vencida(s)` : "Requieren acción correctiva"} onClick={() => setTab("hallazgos")} />
        <Stat icon={Cpu} tone="#2dd4bf" label="Normas en alcance" value={standards.length} sub={standards.map(s=>code(s)).join(" · ")} onClick={() => setTab("config")} />
      </div>

      <div className="kpi-row">
        <MiniStat icon={Radar} tone="#fb923c" label="Riesgos críticos" value={metrics.criticalRisks} onClick={() => setTab("riesgos")} />
        <MiniStat icon={Folder} tone="#60a5fa" label="Docs. pendientes" value={metrics.docsPending} onClick={() => setTab("docs")} />
        <MiniStat icon={Clock} tone="#f87171" label="Docs. a revisar" value={metrics.docsReview} onClick={() => setTab("docs")} />
        <MiniStat icon={Award} tone="#c084fc" label="Auditores calificados" value={metrics.auditorsQ} onClick={() => setTab("compet")} />
        <MiniStat icon={Users} tone="#fbbf24" label="Brechas competencia" value={metrics.compGaps} onClick={() => setTab("compet")} />
        <MiniStat icon={CalendarDays} tone="#34d399" label="Auditorías realizadas" value={`${metrics.annualDone}/${metrics.annualTotal}`} onClick={() => setTab("anual")} />
        <MiniStat icon={FileCheck} tone="#2dd4bf" label="Proceso ISO 19011" value={`${metrics.readiness}%`} onClick={() => setTab("ejec")} />
      </div>

      <div className="panel">
        <div className="panel-h"><Bell size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Alertas automáticas <span className="panel-h-note">análisis por reglas · no IA generativa</span></div>
        <div className="alert-list">
          {alerts.map((a, i) => {
            const s = alertLevel[a.level] || alertLevel.bajo;
            return (
              <div key={i} className="alert-item" style={{ background: s.bg, borderColor: s.ring }}>
                <span className="alert-dot" style={{ background: s.c }} />
                <span className="alert-txt">{a.text}</span>
                {a.level !== "ok" && <span className="alert-lv" style={{ color: s.c }}>{a.level.toUpperCase()}</span>}
              </div>
            );
          })}
        </div>
      </div>

      <TrendPanel trend={metrics.trend} />

      <div className="panel">
        <div className="panel-h">Hallazgos por clasificación</div>
        <div className="cls-grid">
          {cards.map((k) => {
            const t = FINDING_TYPES[k];
            return (
              <button key={k} onClick={() => setTab("hallazgos")} className="cls-card" style={{ borderColor: t.ring, background: t.dbg }}>
                <div className="cls-n mono" style={{ color: t.c }}>{metrics.byType[k] || 0}</div>
                <div className="cls-l" style={{ color: t.c }}>{t.short}</div>
              </button>
            );
          })}
        </div>
      </div>

      <div className="panel">
        <div className="panel-h">Actividad reciente</div>
        {findings.length === 0 ? <div className="empty">Sin hallazgos. Regístralos desde Verificación o Hallazgos.</div> : (
          <ul className="feed">
            {findings.slice(-6).reverse().map((f) => {
              const t = FINDING_TYPES[f.type];
              return (
                <li key={f.id}>
                  <span className="tag" style={{ color: t.c, background: t.dbg, borderColor: t.ring }}>{t.short}</span>
                  <span className="feed-txt">{f.desc || "(sin descripción)"}</span>
                  <span className="feed-ref mono">{f.std ? code(f.std) : ""} {f.clause}</span>

function Gauge({ label, value, suffix, sub, onClick }) {
  const r = 34, C = 2 * Math.PI * r, off = C - (value / 100) * C;
  return (
    <button onClick={onClick} className="panel gauge">
      <svg width="92" height="92" viewBox="0 0 92 92">
        <circle cx="46" cy="46" r={r} fill="none" stroke="rgba(120,140,180,.15)" strokeWidth="7" />
        <circle cx="46" cy="46" r={r} fill="none" stroke="url(#g)" strokeWidth="7" strokeLinecap="round"
          strokeDasharray={C} strokeDashoffset={off} transform="rotate(-90 46 46)" />
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#2dd4bf" /><stop offset="1" stopColor="#38bdf8" /></linearGradient></defs>
        <text x="46" y="50" textAnchor="middle" className="gauge-t">{value}{suffix}</text>
      </svg>
      <div className="gauge-meta"><div className="gauge-l">{label}</div><div className="gauge-s">{sub}</div></div>
    </button>
  );
}
function Stat({ icon: Icon, tone, label, value, sub, onClick }) {
  return (
    <button onClick={onClick} className="panel stat">
      <span className="stat-ic" style={{ color: tone, background: `${tone}1f` }}><Icon size={18} /></span>
      <div><div className="stat-n mono" style={{ color: tone }}>{value}</div><div className="stat-l">{label}</div><div className="stat-s">{sub}</div></div>
    </button>
  );
}
function MiniStat({ icon: Icon, tone, label, value, onClick }) {
  return (
    <button onClick={onClick} className="mini-stat">
      <span className="mini-ic" style={{ color: tone, background: `${tone}1f` }}><Icon size={15} /></span>
      <span className="mini-n mono" style={{ color: tone }}>{value}</span>
      <span className="mini-l">{label}</span>
    </button>
  );
}
function TrendPanel({ trend }) {
  const now = new Date();
  const keys = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); keys.push({ k: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`, label: MONTHS[d.getMonth()] }); }
  const vals = keys.map((x) => trend[x.k] || 0);
  const max = Math.max(1, ...vals);
  const anyData = vals.some((v) => v > 0);
  return (
    <div className="panel">
      <div className="panel-h"><TrendingUp size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Tendencia de hallazgos <span className="panel-h-note">últimos 6 meses</span></div>
      {!anyData ? <div className="empty">Aún no hay hallazgos con fecha para graficar tendencias.</div> : (
        <div className="trend">
          {keys.map((x, i) => (
            <div key={x.k} className="trend-col">
              <div className="trend-bar-wrap"><div className="trend-bar" style={{ height: `${(vals[i] / max) * 100}%` }}><span className="trend-v mono">{vals[i] || ""}</span></div></div>
              <div className="trend-x">{x.label}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function IafSelect({ value, onChange, onOpenChange }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const ref = useRef(null);
  const change = (v) => { setOpen(v); onOpenChange && onOpenChange(v); };
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) { change(false); setQ(""); } };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);
  const t = normTxt(q);
  const list = IAF_CODES.filter((x) => !t || normTxt(x.label).includes(t) || x.c.includes(t) || x.kw.some((k) => normTxt(k).includes(t)));
  const pick = (v) => { onChange(v); change(false); setQ(""); };
  return (
    <div className="sel" ref={ref}>
      <button type="button" className={`sel-btn${open ? " open" : ""}`} onClick={() => change(!open)}>
        <span className={value ? "" : "sel-ph"}>{value || "Selecciona un sector…"}</span>
        <ChevronDown size={16} className="sel-ch" />
      </button>
      {open && (
        <div className="sel-pop">
          <div className="sel-search"><Search size={14} /><input autoFocus value={q} onChange={(e) => setQ(e.target.value)} placeholder="Buscar (calzado, software, alimentos…)" /></div>
          <div className="sel-list">
            {list.map((x) => (
              <button type="button" key={x.c} className={`sel-opt${value === iafValue(x) ? " on" : ""}`} onClick={() => pick(iafValue(x))}>
                <span className="sel-code">IAF/EA {x.c}</span>
                <span className="sel-name">{x.label}</span>
                <span className="sel-nace">NACE {x.nace}</span>
              </button>
            ))}
            {list.length === 0 && q.trim() && <button type="button" className="sel-opt" onClick={() => pick(q.trim())}>Usar “{q.trim()}” (personalizado)</button>}
          </div>
        </div>
      )}
    </div>
  );
}

  const days = [...new Set(plan.map((r) => r.day))];
  if (days.length === 0) days.push("");
  const lastDay = days[days.length - 1] || todayStr();
  const addRow = (day) => setPlan((p) => [...p, { id: uid(), day: day || lastDay, start: "", end: "", activity: "", area: "", clause: "", auditor: audit.leadAuditor || "", auditee: "" }]);

  const setDayDate = (oldDay, newDay) => setPlan((p) => p.map((r) => (r.day === oldDay ? { ...r, day: newDay } : r)));
  const del = (id) => setPlan((p) => p.filter((r) => r.id !== id));
  const dayRows = (d) => plan.filter((r) => r.day === d).sort((a, b) => (a.start || "").localeCompare(b.start || ""));

  const buildDoc = () => {

    const dayBlocks = days.map((d) => {

      const body = rows.map((r) => `<tr><td class="mono">${esc(r.start || "")}${r.end ? "–" + esc(r.end) : ""}</td><td><b>${esc(r.activity || "—")}</b></td><td>${esc(r.area || "—")}</td><td class="mono">${esc(r.clause || "")}</td><td>${esc(r.auditor || "")}</td><td>${esc(r.auditee || "")}</td></tr>`).join("");
      return `<h3>${d ? fmtDate(d) : "Día por definir"}</h3><table class="sch"><thead><tr><th>Horario</th><th>Actividad</th><th>Área / Proceso</th><th>Cláusulas</th><th>Auditor</th><th>Auditado</th></tr></thead><tbody>${body}</tbody></table>`;
    }).join("");
    return `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Plan de Auditoría — ${esc(audit.org || "")}</title>
<style>

${dayBlocks || '<p class="faint">Aún no se han añadido actividades a la agenda.</p>'}
${execution.samplingMethod ? `<p class="note"><b>Muestreo:</b> ${esc(execution.samplingMethod)}${execution.samplingSize ? " · " + esc(execution.samplingSize) : ""}${execution.samplingRationale ? " — " + esc(execution.samplingRationale) : ""}</p>` : ""}
${execution.logistics ? `<p class="note"><b>Logística:</b> ${esc(execution.logistics)}</p>` : ""}
<p class="note"><b>Confidencialidad:</b> ${esc(execution.confidentiality || "La información recopilada se trata de forma confidencial y se usa únicamente para los fines de la auditoría.")}</p>

  };
  const download = () => { const blob = new Blob([buildDoc()], { type: "text/html;charset=utf-8" }); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = `Plan_Auditoria_${slug(audit.org || "auditoria")}.html`; a.click(); URL.revokeObjectURL(url); log && log("Plan de auditoría descargado"); };
  const printDoc = () => { const w = window.open("", "_blank"); if (!w) { alert("Permite las ventanas emergentes para imprimir, o usa Descargar."); return; } w.document.write(buildDoc()); w.document.close(); w.focus(); setTimeout(() => w.print(), 400); log && log("Plan de auditoría enviado a impresión"); };

/* ════════════════════════════════════════════════════════════ CHECKLIST */
function Checklist({ standards, viewStd, setViewStd, checklist, setChecklist, setFindings, setTab, log }) {
  const [open, setOpen] = useState({});
  const [q, setQ] = useState("");
  const [onlyPending, setOnlyPending] = useState(false);
  const std = STANDARDS[viewStd];
  const cov = (() => {
    let total = 0; const by = { C: 0, NC: 0, OBS: 0, NA: 0 }; let naNoJust = 0;
    std.clauses.forEach((c) => c.items.forEach((it) => { total++; const cell = checklist[`${viewStd}|${it.id}`]; if (cell?.status) { by[cell.status] = (by[cell.status] || 0) + 1; if (cell.status === "NA" && !(cell.note || "").trim()) naNoJust++; } }));
    const done = by.C + by.NC + by.OBS + by.NA; return { total, done, pending: total - done, by, naNoJust, pct: total ? Math.round((done / total) * 100) : 0 };
  })();
  const setItem = (key, patch) => setChecklist((c) => ({ ...c, [key]: { ...(c[key] || {}), ...patch } }));
  const createFinding = (item, key) => {
    const st = checklist[key]; const type = st?.status === "NC" ? "ncmenor" : "obs";
    setFindings((f) => [...f, { id: uid(), type, std: viewStd, clause: item.ref, requirement: item.text, desc: st?.note || "", evidence: st?.evidence || "", risk: "", area: "", createdAt: nowISO(), rootCause: { method: "5why", whys: ["", "", "", "", ""], ishikawa: {} }, action: { correction: "", preventiveAction: "", correctiveAction: "", responsible: "", due: "", status: "Abierta", effectiveness: "", closedDate: "", closedBy: "" } }]);
    log && log("Hallazgo creado desde verificación", `${code(viewStd)} ${item.ref}`);
    setTab("hallazgos");
  };
  const filtered = std.clauses.map((c) => ({ ...c, items: c.items.filter((it) => (!q || (it.text + it.ref).toLowerCase().includes(q.toLowerCase())) && (!onlyPending || !checklist[`${viewStd}|${it.id}`]?.status)) })).filter((c) => c.items.length);
  return (
    <div className="wrap">
      <Head icon={ListChecks} title="Lista de verificación" sub={`${std.name} — ${std.full}`} />
      <div className="cl-bar">
        <div className="cl-tabs">
          {standards.map((s) => <button key={s} onClick={() => setViewStd(s)} className={`cl-tab${viewStd === s ? " on" : ""}`} title={STANDARDS[s].full}>{code(s)}</button>)}
        </div>
        <div className="cl-search"><Search size={15} /><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Buscar requisito…" /></div>

          <span className="cov-chip" style={{ color: "#8b98b0" }}>N/A {cov.by.NA}</span>
          <span className="cov-chip" style={{ color: cov.pending ? "#fbbf24" : "#34d399" }}>Pendientes {cov.pending}</span>
          {cov.naNoJust > 0 && <span className="cov-warn">⚠ {cov.naNoJust} N/A sin justificar</span>}
        </div>
      </div>
      <div className="cl-list">
        {filtered.map((c) => {
          const isOpen = open[c.id] ?? true;
          const keys = c.items.map((it) => `${viewStd}|${it.id}`);

          return (
            <div key={c.id} className="cl-clause">

                <span className="cl-clause-t">{c.id}. {c.title}</span>
                <span className="cl-prog mono">{done}/{c.items.length}</span>
              </button>
              {isOpen && (
                <div className="cl-items">
                  {c.items.map((it) => {
                    const key = `${viewStd}|${it.id}`; const st = checklist[key] || {};
                    return (
                      <div key={it.id} className="cl-item">
                        <div className="cl-q"><span className="cl-ref mono">{it.ref}</span><p>{it.text}</p></div>

                        <div className="cl-actions">
                          {Object.entries(CHECK_STATUS).map(([k, v]) => {
                            const Icon = v.icon; const active = st.status === k;
                            return <button key={k} onClick={() => setItem(key, { status: active ? undefined : k })} className="cl-sbtn" style={active ? { background: v.c, borderColor: v.c, color: "#08111c" } : { borderColor: "rgba(120,140,180,.25)", color: "#93a1b8" }}><Icon size={13} /> {v.label}</button>;
                          })}
                          {(st.status === "NC" || st.status === "OBS") && <button onClick={() => createFinding(it, key)} className="cl-make"><Plus size={13} /> Crear hallazgo</button>}
                        </div>
                        {st.status && (
                          <div className="cl-notes">
                            <textarea className="inp" rows={1} placeholder="Evidencia objetiva observada…" value={st.evidence || ""} onChange={(e) => setItem(key, { evidence: e.target.value })} />
                            <textarea className={`inp${st.status === "NA" && !(st.note || "").trim() ? " warn" : ""}`} rows={1} placeholder={st.status === "NA" ? "Justificación del N/A (obligatoria)…" : "Notas / muestreo…"} value={st.note || ""} onChange={(e) => setItem(key, { note: e.target.value })} />
                          </div>
                        )}
                        {st.status === "NA" && !(st.note || "").trim() && <p className="na-warn">⚠ Todo requisito "No aplica" debe justificarse por escrito.</p>}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function RootCause({ finding, upd }) {
  const rc = finding.rootCause || { method: "5why", whys: ["", "", "", "", ""], ishikawa: {} };
  const setMethod = (m) => upd(finding.id, { rootCause: { ...rc, method: m } });
  const setWhy = (i, v) => { const whys = [...(rc.whys || ["", "", "", "", ""])]; whys[i] = v; upd(finding.id, { rootCause: { ...rc, whys } }); };
  const setIsh = (cat, v) => upd(finding.id, { rootCause: { ...rc, ishikawa: { ...(rc.ishikawa || {}), [cat]: v } } });
  return (
    <div className="sub-panel">
      <div className="sub-h"><GitBranch size={15} /> Análisis de causa raíz
        <div className="seg">
          <button className={rc.method === "5why" ? "on" : ""} onClick={() => setMethod("5why")}>5 Porqués</button>
          <button className={rc.method === "ishikawa" ? "on" : ""} onClick={() => setMethod("ishikawa")}>Ishikawa</button>
        </div>
      </div>
      {rc.method === "5why" ? (
        <div className="whys">
          {[0, 1, 2, 3, 4].map((i) => <div key={i} className="why"><span className="mono">¿Por qué {i + 1}?</span><input className="inp" value={(rc.whys || [])[i] || ""} onChange={(e) => setWhy(i, e.target.value)} /></div>)}
          <p className="hint">La última respuesta con evidencia suele ser la causa raíz.</p>
        </div>
      ) : (
        <div className="fg2">{ISHIKAWA_CATEGORIES.map((cat) => <F key={cat} label={cat}><input className="inp" value={(rc.ishikawa || {})[cat] || ""} onChange={(e) => setIsh(cat, e.target.value)} placeholder="Causa potencial" /></F>)}</div>
      )}
    </div>
  );
}
function ActionPlan({ finding, upd }) {
  const a = finding.action || {}; const setA = (k, v) => upd(finding.id, { action: { ...a, [k]: v } });
  const overdue = a.due && a.status !== "Cerrada" && a.due < todayStr();
  return (
    <div className="sub-panel">
      <div className="sub-h"><TrendingUp size={15} /> Plan de acción (CAPA)
        {a.status && <span className="capa-badge" style={{ color: a.status === "Cerrada" ? "#34d399" : overdue ? "#f87171" : "#60a5fa", borderColor: a.status === "Cerrada" ? "rgba(52,211,153,.4)" : overdue ? "rgba(248,113,113,.4)" : "rgba(96,165,250,.4)" }}>{overdue ? "Vencida" : a.status}</span>}
      </div>
      <div className="fg2">
        <F label="Corrección (inmediata)"><textarea className="inp" rows={2} value={a.correction || ""} onChange={(e) => setA("correction", e.target.value)} /></F>
        <F label="Acción correctiva (sobre la causa)"><textarea className="inp" rows={2} value={a.correctiveAction || ""} onChange={(e) => setA("correctiveAction", e.target.value)} /></F>
        <F label="Acción preventiva" hint="Evitar que ocurra en procesos o áreas similares" full><textarea className="inp" rows={2} value={a.preventiveAction || ""} onChange={(e) => setA("preventiveAction", e.target.value)} /></F>
        <F label="Responsable"><input className="inp" value={a.responsible || ""} onChange={(e) => setA("responsible", e.target.value)} /></F>
        <F label="Fecha compromiso"><input type="date" className="inp" value={a.due || ""} onChange={(e) => setA("due", e.target.value)} /></F>
        <F label="Estado"><select className="inp" value={a.status || "Abierta"} onChange={(e) => setA("status", e.target.value)}><option>Abierta</option><option>En proceso</option><option>Cerrada</option></select></F>

      {a.status === "Cerrada" && (
        <div className="fg2 capa-close">
          <F label="Fecha de cierre"><input type="date" className="inp" value={a.closedDate || ""} onChange={(e) => setA("closedDate", e.target.value)} /></F>
          <F label="Cerrado / verificado por"><input className="inp" value={a.closedBy || ""} onChange={(e) => setA("closedBy", e.target.value)} placeholder="Nombre" /></F>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════ ANÁLISIS */
function Bars({ data, unit }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  return (
    <div className="bars">
      {data.length === 0 && <p className="hint">Sin datos suficientes.</p>}
      {data.map((d) => (
        <div key={d.label} className="bar-row">
          <span className="bar-lab" title={d.label}>{d.label}</span>
          <div className="bar-track"><div className="bar-fill" style={{ width: `${(d.value / max) * 100}%`, background: d.color || "var(--acc)" }} /></div>
          <span className="bar-val mono">{d.value}{unit || ""}</span>
        </div>
      ))}
    </div>
  );
}
function Pareto({ data }) {
  const W = 640, H = 240, pl = 34, pr = 40, pt = 16, pb = 46;
  const iw = W - pl - pr, ih = H - pt - pb;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const max = Math.max(1, ...data.map((d) => d.value));
  const n = data.length;
  const bw = n ? Math.min(56, iw / n * 0.62) : 0;
  const step = n ? iw / n : 0;
  let cum = 0;
  const pts = data.map((d, i) => { cum += d.value; const x = pl + step * i + step / 2; const y = pt + ih - (cum / total) * ih; return { x, y, cumPct: Math.round((cum / total) * 100) }; });
  return (
    <div className="tbl-wrap">
      <svg viewBox={`0 0 ${W} ${H}`} className="pareto" role="img" aria-label="Diagrama de Pareto de no conformidades por cláusula">
        {[0, .25, .5, .75, 1].map((g) => <line key={g} x1={pl} x2={pl + iw} y1={pt + ih - g * ih} y2={pt + ih - g * ih} stroke="rgba(120,140,180,.14)" />)}
        {data.map((d, i) => { const h = (d.value / max) * ih; const x = pl + step * i + (step - bw) / 2; return (
          <g key={d.label}>
            <rect x={x} y={pt + ih - h} width={bw} height={h} rx="3" fill="var(--acc)" opacity="0.85" />
            <text x={x + bw / 2} y={pt + ih - h - 5} textAnchor="middle" fontSize="11" fill="var(--muted)" fontFamily="JetBrains Mono, monospace">{d.value}</text>
            <text x={x + bw / 2} y={pt + ih + 15} textAnchor="middle" fontSize="10.5" fill="var(--faint)">{d.label.length > 8 ? d.label.slice(0, 8) : d.label}</text>
          </g>
        ); })}
        {pts.length > 1 && <polyline points={pts.map((p) => `${p.x},${p.y}`).join(" ")} fill="none" stroke="var(--acc2)" strokeWidth="2" />}
        {pts.map((p, i) => <g key={i}><circle cx={p.x} cy={p.y} r="3.2" fill="var(--acc2)" /><text x={p.x} y={p.y - 8} textAnchor="middle" fontSize="9.5" fill="var(--acc2)" fontFamily="JetBrains Mono, monospace">{p.cumPct}%</text></g>)}
      </svg>
    </div>
  );
}
function Analisis({ findings, metrics, standards, setTab }) {
  const isNC = (f) => f.type === "ncm" || f.type === "ncmenor";
  const ncs = findings.filter(isNC);
  const today = todayStr();
  // CAPA
  const closed = ncs.filter((f) => f.action?.status === "Cerrada");
  const open = ncs.filter((f) => f.action?.status !== "Cerrada");
  const overdue = open.filter((f) => f.action?.due && f.action.due < today);
  const withDates = closed.filter((f) => f.action?.closedDate && f.createdAt);
  const avgDays = withDates.length ? Math.round(withDates.reduce((s, f) => s + Math.max(0, daysBetween(f.action.closedDate, f.createdAt.slice(0, 10))), 0) / withDates.length) : null;
  const onTimeSet = closed.filter((f) => f.action?.closedDate && f.action?.due);
  const onTime = onTimeSet.filter((f) => f.action.closedDate <= f.action.due).length;
  const onTimeRate = onTimeSet.length ? Math.round((onTime / onTimeSet.length) * 100) : null;
  const closeRate = ncs.length ? Math.round((closed.length / ncs.length) * 100) : 0;
  // Pareto por cláusula (NC)
  const byClause = {};
  ncs.forEach((f) => { const k = (f.clause || "s/cláusula").trim() || "s/cláusula"; byClause[k] = (byClause[k] || 0) + 1; });
  const pareto = Object.entries(byClause).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value).slice(0, 10);
  // Por tipo
  const byType = Object.entries(FINDING_TYPES).map(([k, v]) => ({ label: v.short, value: metrics.byType[k] || 0, color: v.c })).filter((d) => d.value > 0);
  // Por área
  const byArea = {};
  findings.forEach((f) => { const k = (f.area || "").trim(); if (k) byArea[k] = (byArea[k] || 0) + 1; });
  const areaData = Object.entries(byArea).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value).slice(0, 8);
  // Tendencia mensual
  const trendData = Object.entries(metrics.trend || {}).sort((a, b) => a[0].localeCompare(b[0])).slice(-6).map(([k, v]) => ({ label: k.slice(2), value: v }));
  // Reincidencia
  const recur = Object.entries(byClause).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]);

  return (
    <div className="wrap">
      <Head icon={BarChart3} title="Análisis y tendencias" sub="Estadística de hallazgos, Pareto por cláusula y desempeño del cierre de acciones" />

      <div className="kpi-row an-kpi">
        <MiniStat icon={AlertTriangle} tone="#f87171" label="No conformidades" value={ncs.length} onClick={() => setTab("hallazgos")} />
        <MiniStat icon={CircleCheck} tone="#34d399" label="Tasa de cierre" value={`${closeRate}%`} />
        <MiniStat icon={Clock} tone={overdue.length ? "#f87171" : "#60a5fa"} label="Acciones vencidas" value={overdue.length} onClick={() => setTab("hallazgos")} />
        <MiniStat icon={TrendingUp} tone="#c084fc" label="Cierre a tiempo" value={onTimeRate == null ? "—" : `${onTimeRate}%`} />
        <MiniStat icon={History} tone="#fbbf24" label="Días prom. cierre" value={avgDays == null ? "—" : avgDays} />
        <MiniStat icon={GitBranch} tone="#fb923c" label="Cláusulas reincidentes" value={recur.length} />
      </div>

      <div className="panel">
        <div className="panel-h"><BarChart3 size={14} style={{ verticalAlign: "-2px", marginRight: 6 }} />Pareto de no conformidades por cláusula <span className="panel-h-note">principio 80/20 · prioriza la causa sistémica</span></div>
        {ncs.length === 0 ? <p className="hint">Aún no hay no conformidades registradas.</p> : <Pareto data={pareto} />}
        {recur.length > 0 && <p className="hint" style={{ marginTop: 6 }}>Reincidencia detectada en: {recur.map(([c, n]) => `${c} (${n})`).join(" · ")}. Sugiere debilidad sistémica, no puntual.</p>}
      </div>

      <div className="an-grid">
        <Card title="Distribución por tipo de hallazgo" icon={Filter}><Bars data={byType} /></Card>
        <Card title="Hallazgos por área / proceso" icon={Building2}><Bars data={areaData} /></Card>
      </div>

      <Card title="Tendencia mensual de hallazgos" icon={TrendingUp}>
        <Bars data={trendData} />
        <p className="hint">Últimos periodos con hallazgos registrados (según fecha de creación).</p>
      </Card>

      <Card title="Desempeño del cierre de acciones (CAPA)" icon={CircleCheck}>
        <table className="mini-tbl">
          <thead><tr><th>Indicador</th><th>Valor</th><th>Lectura</th></tr></thead>
          <tbody>
            <tr><td>No conformidades totales</td><td className="mono">{ncs.length}</td><td className="faint">{closed.length} cerradas · {open.length} abiertas</td></tr>
            <tr><td>Tasa de cierre</td><td className="mono">{closeRate}%</td><td className="faint">{closeRate < 100 ? "Quedan acciones por cerrar" : "Todas cerradas"}</td></tr>
            <tr><td>Acciones vencidas</td><td className="mono" style={{ color: overdue.length ? "#f87171" : "inherit" }}>{overdue.length}</td><td className="faint">{overdue.length ? "Riesgo de hallazgo en auditoría externa" : "Sin vencimientos"}</td></tr>
            <tr><td>Cierre a tiempo</td><td className="mono">{onTimeRate == null ? "—" : onTimeRate + "%"}</td><td className="faint">Cerradas dentro del plazo comprometido</td></tr>
            <tr><td>Días promedio de cierre</td><td className="mono">{avgDays == null ? "—" : avgDays}</td><td className="faint">Desde la detección hasta el cierre verificado</td></tr>
          </tbody>
        </table>
      </Card>
    </div>
  );
}

function Informe({ audit, plan, findings, metrics, standards, risks, documents, people, annual, execution, approvals, setApprovals, alerts, log }) {

  const criticalRisks = risks.filter((r) => r.kind === "Riesgo" && r.prob * r.impact >= 8);
  const approvedDocs = documents.filter((d) => d.status === "aprobado").length;
  const auditors = people.filter((p) => p.isAuditor);
  const grouped = Object.keys(FINDING_TYPES).map((k) => ({ k, list: findings.filter((f) => f.type === k) }));
  const today = new Date();

    : metrics.byType.ncmenor > 0
    ? `No se identificaron no conformidades mayores. Existen ${metrics.byType.ncmenor} no conformidad(es) menor(es) cuyo plan de acción debe presentarse en el plazo acordado.`
    : "No se identificaron no conformidades. El sistema de gestión evidencia conformidad con los criterios evaluados.";
  const coverageCaveat = (metrics.pct < 100 || metrics.phasesPending > 0)
